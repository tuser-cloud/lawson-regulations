;Related content&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;Topics&lt;/a&gt;&lt;a href=&quot;#s7&quot;&gt;Share this page&lt;/a&gt;&lt;/div&gt;&lt;/aside&gt;&lt;article class=&quot;paper&quot;&gt;&lt;span class=&quot;badge&quot;&gt;歐盟&lt;/span&gt;&lt;div class=&quot;attribution&quot;&gt;來源：European Medicines Agency (EMA)。此頁為網站閱讀用的靜態整理版本；原始文件之官方來源仍由首頁「前往官方來源」提供。&lt;/div&gt;&lt;section class=&quot;content&quot;&gt;&lt;h1 id=&quot;s1&quot;&gt;Bioanalytical method validation&lt;/h1&gt;&lt;p&gt;- 地區／分類：04_歐盟EMA_EC - 文件性質：正式指引／技術文件；依原文版本與施行日判斷 - 收錄型態：網頁主內容快照 - 擷取日期：2026-11-12（臺灣時間） - 官方來源：https://www.ema.europa.eu/en/scientific-guidelines/bioanalytical-method-validation - 前次對照：前包未列此來源／附件，本次補充 - 發現來源：https://www.ema.europa.eu/en/human-regulatory-overview/research-development/scientific-guidelines/clinical-pharmacology-pharmacokinetics-guidelines - 選取依據：BA/BE、溶離/局部製劑與PK通用指引 - 來源頁可讀主內容與連結快照；動態檢索結果、未開啟的分頁或下層文件不自動等於已下載。&lt;/p&gt;&lt;p&gt;---&lt;/p&gt;&lt;h2 id=&quot;s2&quot;&gt;來源內容&lt;/h2&gt;&lt;h1 id=&quot;s3&quot;&gt;Bioanalytical method validation - Scientific guideline&lt;/h1&gt;&lt;p&gt;Scientific guidelineHumanScientific guidelines&lt;/p&gt;&lt;p&gt;This document defines key elements necessary for the validation of bioanalytical methods. It focuses on the validation of the bioanalytical methods generating quantitative concentration data used for pharmacokinetic and toxicokinetic parameter determinations. It also provides guidance on the application of these validated methods in the routine analysis of study samples from animal and human studies.&lt;/p&gt;&lt;p&gt;*Guideline version EMEA/CHMP/EWP/192217/2009 Rev. 1 Corr. 2\*\* is now superseded by the &lt;a href=&quot;https://www.ema.europa.eu/en/scientific-guidelines/ich-m10-bioanalytical-method-validation &quot; ich=&quot;&quot; m10=&quot;&quot; on=&quot;&quot; bioanalytical=&quot;&quot; method=&quot;&quot; validation&quot;&quot;=&quot;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICH guideline M10 on bioanalytical method validation and study sample analysis&lt;/a&gt;, following its finalisation in July 2022.*&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Keywords:&lt;/strong&gt;Validation, method validation, bioanalytical method, analyses, incurred samples reanalysis, ligand binding assays&lt;/p&gt;&lt;h2 id=&quot;s4&quot;&gt;Document history - Revision 1&lt;/h2&gt;&lt;p&gt;Guideline on bioanalytical method validation&lt;/p&gt;&lt;p&gt;Adopted Reference Number: EMEA/CHMP/EWP/192217/2009 Rev.1 Corr.2\*\* Legal effective date: 01/02/2012 Summary:&lt;/p&gt;&lt;p&gt;This guideline defines key elements necessary for the validation of bioanalytical methods. The guideline focuses on the validation of the bioanalytical methods generating quantitative concentration data used for pharmacokinetic and toxicokinetic parameter determinations. Guidance and criteria are given on the application of these validated methods in the routine analysis of study samples from animal and human studies.&lt;/p&gt;&lt;p&gt;English (EN) (955.68 KB - PDF)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;First published:&lt;/strong&gt; 01/08/2011 &lt;strong&gt;Last updated:&lt;/strong&gt; 03/06/2015&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-bioanalytical-method-validation_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;View&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Overview of comments received on 'Guideline on validation of bioanalytical methods' (EMEA/CHMP/EWP/192217/2009)&lt;/p&gt;&lt;p&gt;Adopted Reference Number: EMA/434565/2010 Summary:&lt;/p&gt;&lt;p&gt;Interested parties (organisations or individuals) that commented on the draft document as released for consultation.&lt;/p&gt;&lt;p&gt;English (EN) (2.46 MB - PDF)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;First published:&lt;/strong&gt; 01/08/2011 &lt;strong&gt;Last updated:&lt;/strong&gt; 01/08/2011&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ema.europa.eu/en/documents/other/overview-comments-received-guideline-validation-bioanalytical-methods-emeachmpewp1922172009_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;View&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Draft guideline on validation of bionanalytical methods&lt;/p&gt;&lt;p&gt;Draft: consultation closed Consultation dates: 20/11/2009 to 31/05/2010 Reference Number: EMEA/CHMP/EWP/192217/2009&lt;/p&gt;&lt;p&gt;English (EN) (135.02 KB - PDF)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;First published:&lt;/strong&gt; 08/12/2009 &lt;strong&gt;Last updated:&lt;/strong&gt; 08/12/2009&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ema.europa.eu/en/documents/scientific-guideline/draft-guideline-validation-bionanalytical-methods_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;View&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Concept paper/recommendations on the need for a (CHMP) guideline on the validation of bioanalytical methods&lt;/p&gt;&lt;p&gt;Reference Number: EMEA/CHMP/EWP/531305/2008&lt;/p&gt;&lt;p&gt;English (EN) (51.71 KB - PDF)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;First published:&lt;/strong&gt; 18/12/2008 &lt;strong&gt;Last updated:&lt;/strong&gt; 18/12/2008&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ema.europa.eu/en/documents/scientific-guideline/concept-paperrecommendations-need-chmp-guideline-validation-bioanalytical-methods_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;View&lt;/a&gt;&lt;/p&gt;&lt;h2 id=&quot;s5&quot;&gt;Related content&lt;/h2&gt;&lt;p&gt;- &lt;a href=&quot;https://www.ema.europa.eu/en/human-regulatory-overview/research-development/scientific-guidelines/clinical-pharmacology-pharmacokinetics-guidelines &quot; clinical=&quot;&quot; pharmacology=&quot;&quot; and=&quot;&quot; pharmacokinetics=&quot;&quot; guidelines&quot;&quot;=&quot;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Clinical efficacy and safety: clinical pharmacology and pharmacokinetics&lt;/a&gt; - &lt;a href=&quot;https://www.ema.europa.eu/en/scientific-guidelines/ich-m10-bioanalytical-method-validation &qu ntific-guidelines/clinical-pharmacology-pharmacokinetics-guidelines - 選取依據：BA/BE、溶離/局部製劑與PK通用指引 - 來源頁可讀主內容與連結快照；動態檢索結果、未開啟的分頁或下層文件不自動等於已下載。</p><p>---</p><h2 id=\"s2\">來源內容</h2><h1 id=\"s3\">Bioanalytical method validation - Scientific guideline</h1><p>Scientific guidelineHumanScientific guidelines</p><p>This document defines key elements necessary for the validation of bioanalytical methods. It focuses on the validation of the bioanalytical methods generating quantitative concentration data used for pharmacokinetic and toxicokinetic parameter determinations. It also provides guidance on the application of these validated methods in the routine analysis of study samples from animal and human studies.</p><p>*Guideline version EMEA/CHMP/EWP/192217/2009 Rev. 1 Corr. 2\\*\\* is now superseded by the <a href=\"https://www.ema.europa.eu/en/scientific-guidelines/ich-m10-bioanalytical-method-validation \" ich=\"\" m10=\"\" on=\"\" bioanalytical=\"\" method=\"\" validation\"\"=\"\" target=\"_blank\" rel=\"noopener\">ICH guideline M10 on bioanalytical method validation and study sample analysis</a>, following its finalisation in July 2022.*</p><p><strong>Keywords:</strong>Validation, method validation, bioanalytical method, analyses, incurred samples reanalysis, ligand binding assays</p><h2 id=\"s4\">Document history - Revision 1</h2><p>Guideline on bioanalytical method validation</p><p>Adopted Reference Number: EMEA/CHMP/EWP/192217/2009 Rev.1 Corr.2\\*\\* Legal effective date: 01/02/2012 Summary:</p><p>This guideline defines key elements necessary for the validation of bioanalytical methods. The guideline focuses on the validation of the bioanalytical methods generating quantitative concentration data used for pharmacokinetic and toxicokinetic parameter determinations. Guidance and criteria are given on the application of these validated methods in the routine analysis of study samples from animal and human studies.</p><p>English (EN) (955.68 KB - PDF)</p><p><strong>First published:</strong> 01/08/2011 <strong>Last updated:</strong> 03/06/2015</p><p><a href=\"https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-bioanalytical-method-validation_en.pdf\" target=\"_blank\" rel=\"noopener\">View</a></p><p>Overview of comments received on 'Guideline on validation of bioanalytical methods' (EMEA/CHMP/EWP/192217/2009)</p><p>Adopted Reference Number: EMA/434565/2010 Summary:</p><p>Interested parties (organisations or individuals) that commented on the draft document as released for consultation.</p><p>English (EN) (2.46 MB - PDF)</p><p><strong>First published:</strong> 01/08/2011 <strong>Last updated:</strong> 01/08/2011</p><p><a href=\"https://www.ema.europa.eu/en/documents/other/overview-comments-received-guideline-validation-bioanalytical-methods-emeachmpewp1922172009_en.pdf\" target=\"_blank\" rel=\"noopener\">View</a></p><p>Draft guideline on validation of bionanalytical methods</p><p>Draft: consultation closed Consultation dates: 20/11/2009 to 31/05/2010 Reference Number: EMEA/CHMP/EWP/192217/2009</p><p>English (EN) (135.02 KB - PDF)</p><p><strong>First published:</strong> 08/12/2009 <strong>Last updated:</strong> 08/12/2009</p><p><a href=\"https://www.ema.europa.eu/en/documents/scientific-guideline/draft-guideline-validation-bionanalytical-methods_en.pdf\" target=\"_blank\" rel=\"noopener\">View</a></p><p>Concept paper/recommendations on the need for a (CHMP) guideline on the validation of bioanalytical methods</p><p>Reference Number: EMEA/CHMP/EWP/531305/2008</p><p>English (EN) (51.71 KB - PDF)</p><p><strong>First published:</strong> 18/12/2008 <strong>Last updated:</strong> 18/12/2008</p><p><a href=\"https://www.ema.europa.eu/en/documents/scientific-guideline/concept-paperrecommendations-need-chmp-guideline-validation-bioanalytical-methods_en.pdf\" target=\"_blank\" rel=\"noopener\">View</a></p><h2 id=\"s5\">Related content</h2><p>- <a href=\"https://www.ema.europa.eu/en/human-regulatory-overview/research-development/sc
