&lt;a href=&quot;#s46&quot;&gt;原PDF第 44 頁&lt;/a&gt;&lt;a href=&quot;#s47&quot;&gt;原PDF第 45 頁&lt;/a&gt;&lt;a href=&quot;#s48&quot;&gt;原PDF第 46 頁&lt;/a&gt;&lt;a href=&quot;#s49&quot;&gt;原PDF第 47 頁&lt;/a&gt;&lt;a href=&quot;#s50&quot;&gt;原PDF第 48 頁&lt;/a&gt;&lt;a href=&quot;#s51&quot;&gt;原PDF第 49 頁&lt;/a&gt;&lt;a href=&quot;#s52&quot;&gt;原PDF第 50 頁&lt;/a&gt;&lt;a href=&quot;#s53&quot;&gt;原PDF第 51 頁&lt;/a&gt;&lt;a href=&quot;#s54&quot;&gt;原PDF第 52 頁&lt;/a&gt;&lt;a href=&quot;#s55&quot;&gt;原PDF第 53 頁&lt;/a&gt;&lt;/div&gt;&lt;/aside&gt;&lt;article class=&quot;paper&quot;&gt;&lt;span class=&quot;badge&quot;&gt;歐盟&lt;/span&gt;&lt;div class=&quot;attribution&quot;&gt;來源：European Commission / EudraLex。此頁為網站閱讀用的靜態整理版本；原始文件之官方來源仍由首頁「前往官方來源」提供。&lt;/div&gt;&lt;section class=&quot;content&quot;&gt;&lt;h1 id=&quot;s1&quot;&gt;EudraLex_Volume_2A_Chapter_1_Marketing_Authorisation&lt;/h1&gt;&lt;p&gt;- 文件性質：歐盟Notice to Applicants指引；不是具獨立法律效力的法規 - 來源網址：https://health.ec.europa.eu/document/download/0174e8fd-9224-4a45-bbd1-e071ffbfe972_en?filename=vol2a_chap1_en.pdf - 擷取日期：2026-11-09（臺灣時間） - 原始檔：&lt;a href=&quot;https://pitdcmis-my.sharepoint.com/personal/p1113_pitdc_org_tw/Documents/Documents/Copilot/Created/EudraLex_Volume_2A_Chapter_1_Marketing_Authorisation.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EudraLex_Volume_2A_Chapter_1_Marketing_Authorisation.pdf&lt;/a&gt; - 版本：Volume 2A Chapter 1 July 2019／Volume 2B各模組版本以PDF封面為準；不表示2026年新修訂。 - 轉換方式：PDF逐頁文字擷取；保留原頁碼及等寬排版，未轉錄圖像內容。跨欄、合併儲存格、數學式及特殊字元應對照原PDF。 - PDF頁數：53&lt;/p&gt;&lt;p&gt;---&lt;/p&gt;&lt;h2 id=&quot;s2&quot;&gt;來源內容&lt;/h2&gt;&lt;h2 id=&quot;s3&quot;&gt;原PDF第 1 頁&lt;/h2&gt;&lt;p&gt;```text EUROPEAN COMMISSION HEALTH AND FOOD SAFETY DIRECTORATE-GENERAL&lt;/p&gt;&lt;p&gt;Health systems and products Medicinal products&lt;/p&gt;&lt;p&gt;Revision 11&lt;/p&gt;&lt;p&gt;NOTICE TO APPLICANTS&lt;/p&gt;&lt;p&gt;VOLUME 2A Procedures for marketing authorisation CHAPTER 1 MARKETING AUTHORISATION&lt;/p&gt;&lt;p&gt;July 2019&lt;/p&gt;&lt;p&gt;This Chapter 1 Marketing Authorisation will be included in The Rules governing Medicinal Products in the European Union The Notice to Applicants Volume 2A Procedures for marketing authorisation&lt;/p&gt;&lt;p&gt;1 ```&lt;/p&gt;&lt;h2 id=&quot;s4&quot;&gt;原PDF第 2 頁&lt;/h2&gt;&lt;p&gt;```text CHAPTER 1 MARKETING AUTHORISATION CHAPTER 1 Marketing Authorisation .......................................................................... 2 1. INTRODUCTION................................................................................................ 3 1.1 Objectives ........................................................................................................ 3 1.2 Status ............................................................................................................... 3 2. MARKETING AUTHORISATION................................................................... 4 2.1 National authorisations .................................................................................... 6 2.2 Union authorisations ....................................................................................... 6 2.3 Notion of ‘global marketing authorisation’ ..................................................... 8 2.4 Validity of the marketing authorisation ........................................................ 10 2.5 Name of a medicinal product ........................................................................ 12 2.6 Transparency ................................................................................................. 13 2.7 Multiple applications ..................................................................................... 13 2.8 Concept of &quot;applicant&quot; and &quot;marketing authorisation holder&quot; ...................... 14 3. MARKETING AUTHORISATION PROCEDURES .................................... 15 3.1 Centralised procedure .................................................................................... 15 3.2 Decentralised procedure and mutual recognition procedure ......................... 17 3.3 Procedure for homeopathic medicinal products ................................................ 18 3.4 Procedure for traditional herbal medicinal products (traditional-use registration) .............................................................................................................. 20 3.5 Paediatric requirements for medicinal products ............................................ 22 3.6 Independent national procedures ................................................................... 23 3.7 Procedures according to Article 126a of Directive 2001/83/EC ................... 23 4. UNION REFERRALS ....................................................................................... 25 5. APPLICATION TYPES .................................................................................... 27 5.1 Basic requirements ........................................................................................ 28 5.2 Applications according to Article 8(3) of Directive 2001/83/EC ................. 29 5.3 Applications according to Article 10 of Directive 2001/83/EC .................... 29 5.5 Application according to Article 10b of Directive 2001/83/EEC ................. 39 5.6 Applications according to Article 10c of Directive 2001/83 /EC ................. 40 6. DATA EXCLUSIVITY AND MARKET PROTECTION ............................. 42 6.1 Data exclusivity and market protection period for reference medicinal products .................................................................................................................... 42 6.2 Extension of the ten year period in Article 10(1) in the case of new therapeutic indications ............................................................................................. 46 6.3. One year period of protection for new indications of well-established substances ................................................................................................................ 47 6.4. One year period of protection for data supporting a change of classification 48 7. VARIATIONS AND EXTENSIONS................................................................ 49 Urgent safety restrictions ......................................................................................... 49 8. PLASMA MASTER FILE PROCEDURE AND VACCINE ANTIGEN MASTER FILE PROCEDURE ................................................................................ 50 ANNEX I DEFINITION OF A NEW ACTIVE SUBSTANCE ............................. 52 ANNEX II GUIDANCE ON THE APPROPRIATE ADDITIONAL STUDIES REQUIRED FOR APPLICATIONS UNDER ARTICLE 10 OF DIRECTIVE 2001/83/EC OR EXTENSION APPLICATIONS ................................................... 53&lt;/p&gt;&lt;p&gt;2 ```&lt;/p&gt;&lt;h2 id=&quot;s5&quot;&gt;原PDF第 3 頁&lt;/h2&gt;&lt;p&gt;```text 1.     INTRODUCTION&lt;/p&gt;&lt;p&gt;1.1     Objectives The primary purpose of the rules governing medicinal products is to safeguard public health. However, this objective must be achieved by means which do not hinder the development of the pharmaceutical industry or trade in medicinal products within the Union. Thus, the pharmaceutical legislation of the European Union has consistently pursued the twin objectives: the protection of public health and the free movement of medicinal products.&lt;/p&gt;&lt;p&gt;General principles of the Union pharmaceutical legislation are given in this chapter. More detailed explanations concerning the different procedures for marketing authorisation are provided in Chapters 2 - 6.&lt;/p&gt;&lt;p&gt;1.2     Status This Notice to Applicants has been prepared in accordance with Article 6 of Regulation (EC) No 726/20041 and Annex I of Directive 2001/83/EC2 on the Community code relating to medicinal products for human use. It is intended to facilitate the interpretation and application of the Union pharmaceutical legislation. It is not legally binding and, in case of doubt, reference should be made to the appropriate Union Directives and Regulations. It is important when reading this text to appreciate that the legal requirements of the Union pharmaceutical legislation must be met and that this Notice to Applicants represents the harmonised view of the Member States, the European Medicines Agency (EMA) and the Commission services on how those requirements may be met.&lt;/p&gt;&lt;p&gt;Guidelines and other interpretative documents to which references are included within this document represent the views of their authors.&lt;/p&gt;&lt;p&gt;References throughout the Notice to Applicants to provisions of Directive 2001/83/EC and Regulation (EC) 726/2004 must be read as references to the directive and the regulation as last amended3, unless it is otherwise expressly stated.&lt;/p&gt;&lt;p&gt;1 OJ L 136, 30.4.2004, p.1. 2 OJ L 331, 28.11.2001, p. 67. 3 Directive 2012/26/EU of the European Parliament and of the Council of 25 October 2012 amending Directive 2001/83/EC as regards pharmacovigilance, OJ L 299 of 27.10.2012, p. 1 and Regulation (EU) No1027/2012 of the European Parliament and of the Council of 25 October 2012 amending Regulation (EC) No726/2004 as regards pharmacovigilance, OJ L 316 of 14/11/2012, p. 8 .&lt;/p&gt;&lt;p&gt;3 ```&lt;/p&gt;&lt;h2 id=&quot;s6&quot;&gt;原PDF第 4 頁&lt;/h2&gt;&lt;p&gt;```text 2.    MARKETING AUTHORISATION A medicinal product may only be placed on the market in the European Economic Area (EEA) when a marketing authorisation has been issued by the competent authority of a Member State for its own territory (national authorisation) or when an authorisation has been granted in accordance with Regulation (EC) No 726/2004 for the entire Union (an Union authorisation). The marketing authorisation holder must be established within the EEA.&lt;/p&gt;&lt;p&gt;Article 54 of the Treaty of the functioning of the European Union (Chapter 2 Right of establishment) reads:&lt;/p&gt;&lt;p&gt;‘Companies or firms formed in accordance with the law of a Member State and having their registered office, central administration or principal place of business within the Union must, for the purposes of this Chapter, be treated in the same way as natural persons who are nationals of Member States. “Companies or firms” means companies or firms constituted under civil or commercial law, including co-operative societies, and other legal persons governed by public or private law, save for those which are non-profit-making’.&lt;/p&gt;&lt;p&gt;For the purpose of applying this definition in the context of the pharmaceutical legislation it should be clarified that ‘non profit-making’ organisations can be marketing authorisation holders.&lt;/p&gt;&lt;p&gt;A marketing authorisation lays down the terms under which the marketing of a medicinal product is authorised in the EU. A marketing authorisation is composed of: (i) a decision granting the marketing authorisation issued by the relevant authority; and (ii) a technical dossier with the data submitted by the applicant in accordance with Articles 8(3) to 11 of Directive 2001/83/EC and Annex I thereto, Articles 6(2) and 31(2) of Regulation (EC) No 726/2004, or Article 7 of Regulation (EC) No 1394/2007.&lt;/p&gt;&lt;p&gt;European Economic Area (EEA)&lt;/p&gt;&lt;p&gt;Norway, Iceland and Liechtenstein form the EEA with the 28 Member States of the European Union. These countries have, through the EEA agreement, adopted the complete Union acquis on medicinal products and are consequently parties to the Union procedures. Where in this chapter reference is made to Member States of the Union this should be read to include Norway, Iceland and Liechtenstein. Legally binding acts from the Union (e.g. Commission decisions) do not directly confer rights and obligations but have first to be transposed into legally binding acts in Norway, Iceland and Liechtenstein. According to Decision N° 74/1999 of the EEA Joint Committee when decisions on approval of medicinal products are taken by the Union, Norway, Iceland and Liechtenstein will take corresponding decisions on the basis of relevant acts. Consequently, these States are concerned with the single European market for medicinal products. Therefore, where in Article 2 of Regulation (EC) No 726/2004 and Article 8 of Directive 2001/83/EC, reference is made to the applicant&lt;/p&gt;&lt;p&gt;4 ```&lt;/p&gt;&lt;h2 id=&quot;s7&quot;&gt;原PDF第 5 頁&lt;/h2&gt;&lt;p&gt;```text being established in the Union, this is extended to include Norway, Iceland and Liechtenstein.&lt;/p&gt;&lt;p&gt;The marketing authorisations granted by Norway, Iceland and Liechtenstein are eligible for the mutual recognition procedure in the same way as the marketing authorisations granted by Member States.&lt;/p&gt;&lt;p&gt;Liechtenstein&lt;/p&gt;&lt;p&gt;Since 1st December 2010 the treaty4 between Liechtenstein and Austria about automatic recognition of the Marketing Authorisations granted via Mutual Recognition Procedure (MRP) or Decentralised Procedure (DCP) is operational. This allows Liechtenstein to use Marketing Authorisations granted by Austria provided the applicants have identified Liechtenstein as CMS in the application form submitted with MRP or DCP applications. At the end of the procedures, Austria will grant authorisations that will be recognised by Liechtenstein. This marketing authorisation can be considered as a marketing authorisation granted in accordance with the pharmaceutical acquis for the purpose of EU legislation and in particular can be considered as a starting point for the purposes of data exclusivity/market protection in the EU. Further, in application of a bilateral agreement5 between Switzerland and Liechtenstein, a Swiss marketing authorisation is automatically effective in Liechtenstein. This recognition has no effects outside the customs union between Switzerland and Liechtenstein. Consequently a marketing authorisation granted by the Swiss authorities and recognised by Liechtenstein, while Switzerland does not apply the EU pharmaceutical acquis, cannot be considered as a marketing authorisation granted in accordance with the pharmaceutical acquis for the purpose of EU legislation and in particular cannot be considered as a starting point for the purposes of data exclusivity/market protection in the EU (see part 6 on data exclusivity/market protection).&lt;/p&gt;&lt;p&gt;Monaco&lt;/p&gt;&lt;p&gt;An agreement between the Union and the Principality of Monaco entered into force on 1 May 2004, Council Decision 2003/885/EC of 17 November 2003 concerning the conclusion of the Agreement on the application of certain Community acts on the territory of the Principality of Monaco6. On the basis of this agreement and the special arrangements agreed between France and the Principality of Monaco in an agreement of 6 January 2003, the French authorities assume the role of competent authorities as far as the application of the medicinal products legislation to products manufactured in Monaco is concerned. The French authorities are responsible for the issue of marketing authorisations for Monaco and conduct inspections on manufacturing sites&lt;/p&gt;&lt;p&gt;4 1Abkommen zwischen der Österreichischen Bundesregierung und der Regierung des Fürstentums Liechtenstein betreffend die automatische Anerkennung von in Österreich zugelassenen bzw. registrierten Human- und Tierarzneimitteln in Liechtenstein (Federal Law Gazette BGBl. III Nr. 126/2010) 5 Website Liechtenstein: http://www.llv.li/amtsstellen/llv-ag-heilmittel-2/llv-ag-arzneimittel-2/llv-ag- arzneimittel zugelassene_arzneimittel.htm 6 O.J. 19.12.03 L 332/42&lt;/p&gt;&lt;p&gt;5 ```&lt;/p&gt;&lt;h2 id=&quot;s8&quot;&gt;原PDF第 6 頁&lt;/h2&gt;&lt;p&gt;```text of medicinal products in Monaco. Batches from Monaco have to be considered as batches which have already undergone controls in a Member State and are therefore exempted from further controls and retesting. The batches may be regarded as released in France, though the place of manufacturing sites is in Monaco.&lt;/p&gt;&lt;p&gt;2.1       National authorisations The competent authorities of the Member States are responsible for granting marketing authorisations for medicinal products which are placed on their markets, except for medicinal products which are authorised under Regulation (EC) No 726/2004 (“Union Authorisations” - see Section 2.2 of this chapter).&lt;/p&gt;&lt;p&gt;In order to obtain a national marketing authorisation, an application must be submitted to the competent authority of the Member State.&lt;/p&gt;&lt;p&gt;In cases where national authorisations are requested for the same medicinal product 7 in more than one Member State and the marketing authorisation holder has received a marketing authorisation in a Member State, the applicant/marketing authorisation holder must submit an application in the Member States concerned using the procedure of mutual recognition. The Member States concerned should then recognise the marketing authorisation already granted by the reference Member State and authorise the marketing of the product on their national territory.&lt;/p&gt;&lt;p&gt;If no marketing authorisation has been granted in the Union, the applicant may make use of a decentralised procedure and submit an application in all the Member States where it intends to obtain a marketing authorisation at the same time, and choose one of them as reference Member State. Based on the assessment report prepared by the reference Member State and any comments made by the concerned Member State, marketing authorisation should be granted in accordance with the decision taken by the reference Member State and concerned Member State in this decentralised procedure.&lt;/p&gt;&lt;p&gt;The mutual recognition procedure and the decentralised procedure are detailed in Chapter 2.&lt;/p&gt;&lt;p&gt;The marketing authorisation must contain the summary of product characteristics according to Article 11 of Directive 2001/83/EC and the labelling and the package leaflet according to Articles 54, 55, 59 and 63.&lt;/p&gt;&lt;p&gt;2.2       Union authorisations The Union will grant marketing authorisations for medicinal products:&lt;/p&gt;&lt;p&gt;   referred to in the Annex to Regulation (EC) No 726/2004, which may only be authorised via the centralised procedure (mandatory scope);&lt;/p&gt;&lt;p&gt;7 For an explanation of what constitutes the “same medicinal product” in this context, see section E.3 of Commission communication on the Community marketing authorisation procedures for medicinal products (Official Journal C 229, 22/7/1998 p. 4 - 17).&lt;/p&gt;&lt;p&gt;6 ```&lt;/p&gt;&lt;h2 id=&quot;s9&quot;&gt;原PDF第 7 頁&lt;/h2&gt;&lt;p&gt;```text    referred to in Article 3(2) of Regulation (EC) No 726/2004, relating to products containing new active substances, products which constitute a significant therapeutic, scientific or technical innovation or products for which the granting of a Union authorisation would be in the interest of patients or animal health at Union level. The applicant has to request confirmation that the product is eligible for evaluation through the centralised procedure (optional scope) and the EMA will decide on the matter; and&lt;/p&gt;&lt;p&gt;   a generic medicinal product of a centrally authorised medicinal product if not using the option in Article 3(3) of Regulation (EC) No 726/2004&lt;/p&gt;&lt;p&gt;Scientific aspects and working definitions for the mandatory scope of the centralised procedure        drawn       up       by       EMA        are      available        at http://www.ema.europa.eu/pdfs/human/regaffair/12194407en.pdf&lt;/p&gt;&lt;p&gt;In order to obtain a Union authorisation, an application must be submitted to the EMA. See also section 3.1 of this chapter.&lt;/p&gt;&lt;p&gt;The scientific evaluation of the application is carried out within the Committee for Medicinal Products for Human Use (CHMP) of the EMA, and a scientific opinion is prepared. The opinion is sent to the European Commission which drafts a Decision. Having consulted the Member States through the relevant Standing Committee, the Commission adopts the Decision and grants a marketing authorisation (see Chapter 6 of the Notice to applicants for further details on the decision making process).&lt;/p&gt;&lt;p&gt;Such a marketing authorisation is valid throughout the Union and confers the same rights and obligations in each of the Member States as a marketing authorisation granted by that Member State.&lt;/p&gt;&lt;p&gt;The marketing authorisation must contain the summary of product characteristics according to Article 11 of Directive 2001/83/EC and the labelling and the package leaflet according to Title V of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;Once a central marketing authorisation has been issued, the maintenance of existing national marketing authorisation or the issuing of new national marketing authorisations for the same medicinal product could be envisaged only as long as the therapeutic indications are different in national and central marketing authorisations.&lt;/p&gt;&lt;p&gt;Indeed, if a product falls under the optional scope of the centralised procedure (Article 3(2) of Regulation (EC) No. 726/2004), the applicant has the choice of using either the centralised or the national (decentralised/mutual recognition) procedure for the same medicinal product. The &quot;Communication on the Community marketing authorisation procedures for medicinal products&quot;8 clarifies that this choice does not allow both a central and a national marketing authorisation to co-exist simultaneously for the same product and that once a central marketing authorisation has been issued, there is no room for an additional scientific evaluation and regulatory decision for the same medicinal product (see in particular point A.2 and conclusion of the&lt;/p&gt;&lt;p&gt;8 Commission Communication 98/C229/03&lt;/p&gt;&lt;p&gt;7 ```&lt;/p&gt;&lt;h2 id=&quot;s10&quot;&gt;原PDF第 8 頁&lt;/h2&gt;&lt;p&gt;```text Communication). If such situation would occur the Commission would consider the need for a referral procedure.&lt;/p&gt;&lt;p&gt;The only exception for possible co-existence of central and national marketing authorisation that the Communication provides concern cases where there are different therapeutic indications (see point A.2.b).&lt;/p&gt;&lt;p&gt;2.3      Notion of ‘global marketing authorisation’9 Article 6(1) second subparagraph of Directive 2001/83/EC provides that when a medicinal product has been granted an initial marketing authorisation, any additional strengths, pharmaceutical forms, administration routes, presentations as well as any variations and extensions must also be granted an authorisation or be included in the initial marketing authorisation. All these marketing authorisations are considered as belonging to the same global marketing authorisation, in particular for the purpose of the application of Article 10 of the directive, which lays down rules on data exclusivity and market protection and on the so-called European Reference Product.&lt;/p&gt;&lt;p&gt;Thus, the global marketing authorisation contains the initial authorisation and all variations and extensions thereof, as well as any additional strengths, pharmaceutical form, administration routes or presentations authorised through separate procedures, including in different Member States within the EU, and under a different name, granted to the marketing authorisation holder of the initial authorisation. Where a product is initially authorised nationally and, subsequently, an additional strength, pharmaceutical form, administration route or presentation is authorised through the centralised procedure, this is also part of the same global marketing authorisation.&lt;/p&gt;&lt;p&gt;To determine the notion of same marketing authorisation holder or applicant in this context, see section 2.8.&lt;/p&gt;&lt;p&gt;1. If the medicinal product being assessed contains a modification of an existing active substance, it should be clarified during the marketing authorisation procedure whether the product contains a new active substance or not. This clarification impacts on the existence or not of a global marketing authorisation if the medicinal products belong to the same marketing authorisation holder. Request for a new active substance claim should be submitted within the initial marketing authorisation application for medicinal product containing the modified substance and will not be considered retroactively. This assessment is to be done in accordance with the definition of a new active substance provided in Annex I10 at the end of this Chapter and the conclusion should be reflected at least in the assessment report. If the assessment report does not indicate that the product contains a new active&lt;/p&gt;&lt;p&gt;9 Global Marketing Authorisation has to be read in the light of Article 6(1) of Directive 2001/83/EC; it does not mean a ‘world wide Marketing Authorisation’. 10 Annex I at the end of this Chapter applies for the purposes of application of Article 6 and Article 10 of Directive 2001/83/EC. However, for the purposes of Article 3(2) of Regulation (EC) No 726/2004 a &quot;new active substance&quot; is defined in paragraph 3 of the Annex of that Regulation..&lt;/p&gt;&lt;p&gt;8 ```&lt;/p&gt;&lt;h2 id=&quot;s11&quot;&gt;原PDF第 9 頁&lt;/h2&gt;&lt;p&gt;```text substance, it will be considered that the product at stake contains the same active substance and belongs to the global marketing authorisation of the already authorised medicinal product(s) as described in Article 6(1) of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;Example: Active substance A in MP 1 active substance A’ in MP 2&lt;/p&gt;&lt;p&gt;2. If the medicinal product being assessed contains within the same pharmaceutical form a combination of active substances, it will form a new and unique medicinal product requiring a separate marketing authorisation, regardless whether all of the active substances contained therein were already authorised in a medicinal product or not. In its application for the new combination, the applicant must demonstrate that each active substance has a documented therapeutic contribution within the combination and therefore all compounds are different active substance11. The authorisation for this new combination medicinal product is not considered to fall within the scope of the global marketing authorisations of the already authorised medicinal product(s) as described in Article 6(1) of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;Examples:&lt;/p&gt;&lt;p&gt;Active substance A in MP1, active substance B in MP2  Active substances A+B in MP3&lt;/p&gt;&lt;p&gt;Active substances A+B in MP1, Active substances C+D in MP2 Active substances A+C in MP3&lt;/p&gt;&lt;p&gt;Active substances A+B in MP1, Active substance C in MP2  Active substances A+C in MP3&lt;/p&gt;&lt;p&gt;Active substances A+B in MP1 Active substance A+C in MP2&lt;/p&gt;&lt;p&gt;3. If the medicinal product being assessed contains only one active substance which was part of an authorised combination product, the new medicinal product will form a new and unique medicinal product requiring a separate marketing authorisation. Considering that during the assessment procedure of the already authorised combination product, the marketing authorisation holder had demonstrated that each substance of the fixed combination has a documented therapeutic contribution within the combination and therefore all compounds are different active substances11, the authorisation for the new medicinal product is not considered to fall within the scope of the global marketing authorisations of the already authorised combination medicinal product as described in Article 6(1) of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;Example: Active substances A+B in MP 1  Active substance A in MP2&lt;/p&gt;&lt;p&gt;11   See DRAF T Reflect ion pa per on t he ch em ica l st ru ct ur e a n d pr ope r t ies cr iter ia to be con sidered for t he eva lu a t ion   of      New       Act ive  5   Su bst a n ce      (NAS)       st a t u s of     ch em ica l  su bst a n ces [h t t p://www.em a .eu ropa .eu /docs/en_GB/docum en t_libr a r y/Scien t ific_gu ideline/2015/04/WC500186193.pdf ].&lt;/p&gt;&lt;p&gt;9 ```&lt;/p&gt;&lt;h2 id=&quot;s12&quot;&gt;原PDF第 10 頁&lt;/h2&gt;&lt;p&gt;```text The implications of the notion of global marketing authorisation for the purpose of the application of rules on data exclusivity and market protection are referred to in section 6 below.&lt;/p&gt;&lt;p&gt;Multiple applications of the same marketing authorisation holder are covered by the notion of ‘global marketing authorisation’.&lt;/p&gt;&lt;p&gt;2.4     Validity of the marketing authorisation&lt;/p&gt;&lt;p&gt;2.4.1 Renewal&lt;/p&gt;&lt;p&gt;Marketing authorisations granted in the Union have an initial duration of five years (Articles 14(1) of Regulation (EC) No 726/2004 and 24(1) of Directive 2001/83/EC). After these five years, the marketing authorisation may be renewed on the basis of a re-evaluation of the risk-benefit balance. To this end, the marketing authorisation holder must provide the EMA or the national competent authority with a consolidated version of the file in respect of quality, safety and efficacy, including all variations introduced since the marketing authorisation was granted, at least nine months before the marketing authorisation ceases to be valid (Articles 14(2) of Regulation (EC) No 726/2004 and 24(2) of Directive 2001/83/EC). Once renewed, the marketing authorisation is valid for an unlimited period unless the Commission or the national competent authority decides, on justified grounds relating to pharmacovigilance, to proceed with one additional five-year renewal (Articles 14(3) of Regulation (EC) No 726/2004 and 24(3) of Directive 2001/83/EC).&lt;/p&gt;&lt;p&gt;While the submission of the file should take place at least 9 months prior to the expiry of the marketing authorisation, premature submissions should be avoided. In this regard, it is noted that the renewal should take place upon the expiry of the period of five years and that such decision will be based on the consolidated file submitted by the marketing authorisation holder for this purpose, demonstrating that the benefit- risk is positive. A submission that is made too prematurely may not be sufficiently up to date for the Commission/Competent Authorities to adopt a decision on the renewal.&lt;/p&gt;&lt;p&gt;Recommendations regarding the content of the consolidated file for the renewal are provided in the EMA Guideline on the Processing of Renewals in the Centralised Procedure 12 and CMDh Best Practice Guide on the processing of renewals in the MRP/DCP 13.&lt;/p&gt;&lt;p&gt;12 http://ec.europa.eu/health/files/eudralex/vol-2/2012-06_gpr.pdf 13http://www.hma.eu/fileadmin/dateien/Human_Medicines/CMD_h_/procedural_guidance/Renewal/C MDh_004_2005_Rev.9_cl.pdf&lt;/p&gt;&lt;p&gt;10 ```&lt;/p&gt;&lt;h2 id=&quot;s13&quot;&gt;原PDF第 11 頁&lt;/h2&gt;&lt;p&gt;```text 2.4.2 Cessation of the marketing authorisation if the medicinal product is not marketed&lt;/p&gt;&lt;p&gt;According to Article 24(4) to (6) of Directive 2001/83/EC and Article 14(4) to (6) of Regulation (EC) No 726/2004 any authorisation which within three years of its granting is not followed by the actual placing on the market of the authorised product in the authorising Member State or on the Union market will cease to be valid. When an authorised product previously placed on the market in the authorising Member State or in the Union is no longer actually present on the market for a period of three consecutive years, the authorisation for that product will cease to be valid. The competent authority may, in exceptional circumstances and on public health grounds grant exemptions. Such exemptions must be duly justified.&lt;/p&gt;&lt;p&gt;The determination of the start of the three year period from the granting of the marketing authorisation should be the date when the medicinal product can be marketed by the marketing authorisation holder, taking into account, e.g. the market protection and other protection rules which have to be respected.&lt;/p&gt;&lt;p&gt;The absence of the medicinal product from the market must be of three consecutive years, therefore in case the medicinal product would be put back on the market, the period of three years would restart. This situation may occur several times.&lt;/p&gt;&lt;p&gt;The marketing authorisation will remain valid if at least one presentation of the medicinal product is placed on the market and if at least one pack-size of the existing pack-sizes for that presentation is marketed. For the purposes of the application of these rules, a marketing authorisation comprises the initial authorisation and all variations and extensions granted to the marketing authorisation holder under the same name.&lt;/p&gt;&lt;p&gt;For the purposes of the application of Article 24(4) to (6) of Directive 2001/83/EC and Article 14(4) to (6) of Regulation (EC) No 726/2004, a medicinal product is “placed on the market” at the date of release into the distribution chain. It is the date when the product comes out of the control of the marketing authorisation holder.&lt;/p&gt;&lt;p&gt;For centrally authorised medicinal products “placed on the Union market” means that the medicinal product is at least marketed in one Member State of the Union. For nationally authorised products “placed on the market in the authorising Member State” means that the medicinal product is on the market of the Member State which has granted the marketing authorisation. This is independent of the authorisation procedure used (decentralised, mutual recognition or purely national procedure).&lt;/p&gt;&lt;p&gt;A medicinal product ceases to be placed on the market when the marketing authorisation holder ceases to release it in the distribution chain.&lt;/p&gt;&lt;p&gt;Information regarding the placing of a medicinal product on the market should be provided in accordance with Article 23a of Directive 2001/83/EC and Article 13(4) of Regulation (EC) No 726/2004. After a marketing authorisation has been granted, the holder of the authorisation must inform the competent authority of the authorising Member State or the EMA of the date of actual marketing of the medicinal product in that Member State or in the Union, taking into account the various presentations authorised. The holder must also notify the national competent authority or the EMA&lt;/p&gt;&lt;p&gt;11 ```&lt;/p&gt;&lt;h2 id=&quot;s14&quot;&gt;原PDF第 12 頁&lt;/h2&gt;&lt;p&gt;```text if the product ceases to be placed on the market, either temporarily or permanently. Such notification must, otherwise than in exceptional circumstances, be made no less than 2 months before the interruption in the placing on the market of the product. The marketing authorisation holder must inform the national competent authorities or the EMA of the reasons for such action. Upon request by the national competent authority or the EMA, particularly in the context of pharmacovigilance, the marketing authorisation holder must provide the national competent authority or the EMA with all data relating to the volume of sales of the medicinal product, and any data in his possession relating to the volume of prescriptions.&lt;/p&gt;&lt;p&gt;2.4.3 Suspension or withdrawal of medicinal product and voluntary withdrawal of marketing authorisation&lt;/p&gt;&lt;p&gt;A marketing authorisation holder must notify respectively the Member States concerned/EMA of any action taken to suspend the marketing or to withdraw a medicinal product from the market, to request the withdrawal or to not request the renewal of a marketing authorisation together with the reasons for such action. He must in particular declare if his action concerns the efficacy of the medicinal product or the protection of public health.&lt;/p&gt;&lt;p&gt;2.5    Name of a medicinal product A marketing authorisation is granted to a single marketing authorisation holder who is responsible for placing the medicinal product on the market. The marketing authorisation, delivered through centralised, national or decentralised/mutual recognition procedure, must contain the name of the medicinal product, which may be either an invented name, or a common or scientific name (when available, the International Non-Proprietary Name of the active substance(s)) accompanied by a trade mark or the name of the marketing authorisation holder.&lt;/p&gt;&lt;p&gt;In the case of Union authorisations granted following applications through the centralised procedure, it is important that applicants identify at an early stage a name which would be valid throughout the Union when using the centralised procedure. However, in exceptional cases, the Commission may authorise the use of a different name in a Member State where the proposed name has been cancelled, opposed or objected to under trade-mark law (Article 6(1) of Regulation (EC) No 726/2004).&lt;/p&gt;&lt;p&gt;See also the EMA ‘Guideline on the acceptability of name for human medicinal products     processed   through    centralised   procedure’    available   at http://www.ema.europa.eu/docs/en_GB/document_library/Regulatory_and_procedura l_guideline/2009/10/WC500004142.pdf&lt;/p&gt;&lt;p&gt;For applications through the mutual recognition and decentralised procedures, it is recommended whenever feasible that the same name for a given medicinal product should be used in all Member States. If a different name is to be used, it should be quoted in a covering letter from the applicant to the relevant competent authorities.&lt;/p&gt;&lt;p&gt;Where a generic of a medicinal product authorised through the centralised procedure is authorised by the competent authorities of the Member States in accordance with Article 10(1) of the Directive 2001/83/EC, the generic medicinal product has to be&lt;/p&gt;&lt;p&gt;12 ```&lt;/p&gt;&lt;h2 id=&quot;s15&quot;&gt;原PDF第 13 頁&lt;/h2&gt;&lt;p&gt;```text authorised under the same name in all the Member States where the application has been made. For these purposes, all the linguistic versions of the international non- proprietary name is considered to be the same name (Article 3(3) of Regulation (EC) No 726/2004).&lt;/p&gt;&lt;p&gt;2.6    Transparency In accordance with Article 21 of Directive 2001/83/EC, the national competent authorities are obliged to make publicly available the decision granting the marketing authorisation together with the package leaflet, the summary of the product characteristics and any possible conditions to the marketing authorisation. In addition, they must draw up an assessment report for each marketing authorisation granted, together with the reasons for their opinion, after deletion of any information of a commercially confidential nature. The justification should be provided separately for each indication applied for.&lt;/p&gt;&lt;p&gt;As regards products authorised through the centralised procedure, notification of the marketing authorisation must be published in the Official Journal of the European Union and the EMA must publish the assessment report of the CHMP together with the reasons for its opinion, after deletion of any information of a commercially confidential nature (Article 13 of Regulation (EC) No 726/2004).&lt;/p&gt;&lt;p&gt;2.7    Multiple applications&lt;/p&gt;&lt;p&gt;In the framework of the centralised procedure only one marketing authorisation may be granted to an applicant for a specific medicinal product. However, according to Article 82(1) 2nd subparagraph of Regulation (EC) 726/2004 the same applicant can submit more than one application for the same medicinal product when there are objective verifiable reasons relating to public health regarding the availability of medicinal products to health-care professionals and/or patients or for co-marketing reasons. In such case, the Commission will inform the applicant whether the conditions are met before he submits his application to the EMA. For further details see the Commission services note on the handling of Duplicate Marketing Authorisation Application, http://ec.europa.eu/health/files/latest_news/2011_09_upd.pdf There are no corresponding provisions in Directive 2001/83/EC that apply to the mutual recognition and decentralised procedures. In such circumstances, the acceptance of multiple applications in mutual recognition and decentralised procedures should, however, not be used to undermine harmonisation at Union level or to circumvent the application of Union legislation. In particular, multiple applications should not lead to applications for the same medicinal product being submitted in different Member States and handled outside the principles of mutual recognition laid down in chapter IV of Directive 2001/83/EC. To avoid such an effect, the following principles should be observed:&lt;/p&gt;&lt;p&gt;- reference to any authorisation obtained for that medicinal product should be provided with the application for a marketing authorisation;&lt;/p&gt;&lt;p&gt;13 ```&lt;/p&gt;&lt;h2 id=&quot;s16&quot;&gt;原PDF第 14 頁&lt;/h2&gt;&lt;p&gt;```text - as far as possible, the same reference Member State should be used in case of multiple applications; - Article 18 should be relied on to avoid that multiple applications are used to obtain marketing authorisations for the same medicinal product in different Member States outside the procedural framework of chapter IV of Directive 2001/83/EC; - the applicant may decide whether the mutual recognition procedure or the decentralised procedure is used for obtaining the multiple     marketing authorisations.&lt;/p&gt;&lt;p&gt;See CMDh Recommendations on Multiple Applications in Mutual Recognition and Decentralised Procedures available at http://www.hma.eu/91.html&lt;/p&gt;&lt;p&gt;2.8      Concept of &quot;applicant&quot; and &quot;marketing authorisation holder&quot; The concept of &quot;applicant&quot; and &quot;marketing authorisation holder&quot; are important for the application of the global marketing authorisation definition and also in other contexts, such as the submission of applications under Directive 2001/83/EC, the submission of variations under work-sharing procedures or the submission of multiple marketing authorisations under Article 82(1) of Regulation (EC) No 726/2004. The definition of &quot;applicant&quot; provided for in the 1998 Commission Communication14 is still applicable and is clarified below.&lt;/p&gt;&lt;p&gt;An &quot;applicant&quot; and &quot;marketing authorisation holder&quot; can be a physical or legal entity. However, for the purposes of the application of the pharmaceuticals rules, having a distinct legal personality does not necessarily entail that each entity can be considered as a distinct applicant or marketing authorisation holder to the other one. In particular, it is noted:  Applicants and marketing authorisation holders belonging to the same company group or that are controlled by the same physical or legal entity are to be considered as one entity.&lt;/p&gt;&lt;p&gt;     Applicants and marketing authorisation holders that do not belong to the same company group and are not controlled by the same physical or legal entity are to be considered as one applicant/marketing authorisation holder if they have concluded tacit or explicit agreements concerning the marketing of the same medicinal product for the purposes of the application of the pharmaceuticals rules regarding that medicinal product. This includes cases of joint marketing but also cases where one party licenses to the other party the right to market the same medicinal product in exchange for fees or other considerations.&lt;/p&gt;&lt;p&gt;This concept applies, mutatis mutandis, to the definition of &quot;sponsor&quot; in the context of orphan designations.&lt;/p&gt;&lt;p&gt;14 OJ C 229, 22/7/1998, p.4&lt;/p&gt;&lt;p&gt;14 ```&lt;/p&gt;&lt;h2 id=&quot;s17&quot;&gt;原PDF第 15 頁&lt;/h2&gt;&lt;p&gt;```text 3.    MARKETING AUTHORISATION PROCEDURES&lt;/p&gt;&lt;p&gt;3.1    Centralised procedure A marketing authorisation granted under the centralised procedure is valid for the entire EU market, which means the medicinal product may be put on the market in all Member States. For medicinal products which fall within the mandatory scope of the centralised procedure in accordance with the Annex to Regulation (EC) No 726/2004, the application is submitted to the EMA. An application may likewise be submitted to the EMA for medicinal products which fall within the optional scope of the centralised procedure in accordance with Article 3(2) and 3(3) of Regulation (EC) No 726/2004 where the applicant wishes to obtain a Union marketing authorisation.&lt;/p&gt;&lt;p&gt;In particular, applications on the basis of Article 10, where the reference medicinal products is centrally authorised may be submitted via the centralised procedure. Alternatively, they may be authorised by the competent authorities of the Member States through a national, mutual recognition procedure or decentralised procedure provided that the conditions, laid down in Article 3(3) of the Regulation are met (e.g. same summary of product characteristics, same name in all the Member States).&lt;/p&gt;&lt;p&gt;Those Similar biological (“biosimilar”) medicinal products which are developed by means of one of the biotechnological processes listed in the Annex to Regulation(EC) No 726/2004 must however be authorised via the centralised procedure.&lt;/p&gt;&lt;p&gt;Following the scientific evaluation and upon receipt of the opinion, the European Commission drafts a decision on an Union marketing authorisation and, after consulting the Standing Committee for Medicinal Products for Human Use, grants a marketing authorisation. The Commission Decision shall, based on the scientific recommendation of the CHMP, specify in its Annexes the conditions or restrictions regarding the supply and use including the following sub-categories: medicinal product subject to medical prescription, medicinal product subject to special and/or restricted prescription, medicinal product not subject to prescription. Any restriction foreseen in supply and use reflected in Section 4.2 of the Summary of Product Characteristics will be translated into the legal status in Annex II.&lt;/p&gt;&lt;p&gt;When a marketing authorisation application is submitted for a product which is of major public health interest, in particular from the viewpoint of therapeutic innovation, the applicant may request an accelerated assessment procedure in accordance with Article 14(9) of Regulation (EC) 726/2004. The applicant should justify their expectation that the medicinal product is of major public health interest particularly from the point of view of therapeutic innovation.&lt;/p&gt;&lt;p&gt;For further details on the documentation required to substantiate a request for accelerated assessment and on the reduced timetable, reference is made to the EMA website.&lt;/p&gt;&lt;p&gt;15 ```&lt;/p&gt;&lt;h2 id=&quot;s18&quot;&gt;原PDF第 16 頁&lt;/h2&gt;&lt;p&gt;```text 3.1.1 Conditional marketing authorisation, marketing authorisation granted under exceptional circumstances and marketing authorisation subject to conditions&lt;/p&gt;&lt;p&gt;The conditional marketing authorisation is only provided for the centralised procedure (Article 14(7) of Regulation (EC) No 726/2004. Commission regulation (EC) No 507/2006 is laying down the rules on the granting of such marketing authorisation.&lt;/p&gt;&lt;p&gt;It must be distinguished from the marketing authorisation under exceptional circumstances (Article 14(8) of Regulation (EC) No 726/2004 and Article 22 of Directive 2001/83/EC) and the marketing authorisation subject to conditions (Article 9.4 b, c, ca, cb, cc. of Regulation No 726/2004 and Article 21a of Directive 2001/83/EC) which are possible under centralised and National/DCP/MRP procedures.&lt;/p&gt;&lt;p&gt;3.1.2 Orphan medicinal products&lt;/p&gt;&lt;p&gt;There are two EU Regulations covering orphan medicinal products: Regulation (EC) No 141/2000 and its implementing regulation, Commission Regulation (EC) No 847/200015.&lt;/p&gt;&lt;p&gt;The aim of the legislation on orphan medicinal products is to stimulate research and development of medicinal products for rare diseases by providing incentives to sponsors in order to ensure access to treatment for patients suffering from rare diseases. Incentives include a 10-year period of market exclusivity once an orphan medicinal product is authorised, protocol assistance, eligibility for Union and Member State initiatives which support research and development of orphan medicinal products, and the possibility to request fee reductions from the EMA.&lt;/p&gt;&lt;p&gt;3.1.3 Advanced Therapy Medicinal Products&lt;/p&gt;&lt;p&gt;Regulation (EC) No 1394/2007 of the European Parliament and of the Council of 13 November 2007 on Advanced Therapy Medicinal Products (ATMP) applies in the European Union from 30 December 2008.&lt;/p&gt;&lt;p&gt;3.1.4 Transfer of a Union marketing authorisation&lt;/p&gt;&lt;p&gt;The transfer of a marketing authorisation granted under the centralised procedure is regulated in Commission Regulation (EC) No. 2141/96, of 7 November 1996.&lt;/p&gt;&lt;p&gt;In accordance with that Regulation, the marketing authorisation holder should submit an application to the EMA with supported documents.&lt;/p&gt;&lt;p&gt;When transferring the marketing authorisation of a designated Orphan medicinal product, the marketing authorisation holder must also transfer the Orphan designation of the product concerned in accordance with Article 5(11) of Regulation (EC) No 141/2000.&lt;/p&gt;&lt;p&gt;15 OJ L 103, 28.4.2000, p. 5.&lt;/p&gt;&lt;p&gt;16 ```&lt;/p&gt;&lt;h2 id=&quot;s19&quot;&gt;原PDF第 17 頁&lt;/h2&gt;&lt;p&gt;```text 3.2     Decentralised procedure and mutual recognition procedure Both the decentralised and the mutual recognition procedures are based on the recognition by national competent authorities of an assessment performed by the authorities of one Member State. According to the European Court of Justice, &quot;[…] Article 28 of Directive 2001/83/EC […] confers a Member State in receipt of an application for mutual recognition only a very limited discretion in relation to the reasons for which that Member State is entitled to refuse to recognise the marketing authorisation in question. In particular, as regards any assessment going beyond the verification of the validity of the application with regard to the conditions laid down in Article 28, the Member State concerned, except where there is a risk to public health, must rely on the assessments and scientific evaluations carried out by the reference Member State&quot;16. Although the facts of the case relate to a MRP, the ECJ is interpreting Article 28 (4) which applies both to MRP and DCP17.&lt;/p&gt;&lt;p&gt;To allow operation of the system, applicants for marketing authorisation are obliged to include in their applications copies of any authorisation previously obtained in other Member States as well as a list of those Member States in which an application for authorisation is under examination (article 8(3)(l) of Directive 2001/83/EC). In addition, the dossier on which the marketing authorisation is based must be regularly updated (see section 5.1.1 below).&lt;/p&gt;&lt;p&gt;3.2.1 Decentralised procedure&lt;/p&gt;&lt;p&gt;For medicinal products not falling within the mandatory scope of the centralised procedure, the applicant may request one or more concerned Member State(s) to approve a draft assessment report, summary of product characteristics (SmPC), labelling and package leaflet as proposed by the chosen reference Member State. An application is submitted to the competent authorities of the reference Member State and the concerned Member State(s), together with the information and particulars referred to in Articles 8, 10, 10a, 10b, 10c, and 11 of Directive 2001/83/EC. The applicant must give an assurance that the dossier, including the proposed SmPC, labelling and package leaflet, is identical as submitted in all Member States concerned (reference Member State and concerned Member State). Differences in proposed prescription status and names of the medicinal product are acceptable, in line with national rules in force.&lt;/p&gt;&lt;p&gt;At the end of the decentralised procedure with a positive agreement, a national marketing authorisation will be issued in the reference Member State and the concerned Member State. The harmonisation is maintained through the procedures of&lt;/p&gt;&lt;p&gt;16 §41 of ECJ C-452/06 17 ECJ C-145/11, (cf. para. 39).&lt;/p&gt;&lt;p&gt;17 ```&lt;/p&gt;&lt;h2 id=&quot;s20&quot;&gt;原PDF第 18 頁&lt;/h2&gt;&lt;p&gt;```text Regulation (EC) No 1234/2008 for the examination of variations and the use of the decentralised and mutual recognition procedures for extensions.&lt;/p&gt;&lt;p&gt;For further details see chapter 2.&lt;/p&gt;&lt;p&gt;3.2.2 Mutual recognition procedure&lt;/p&gt;&lt;p&gt;This procedure is based on the mutual recognition by concerned Member State(s) of a national marketing authorisation granted by the reference Member State. The concerned Member State refers to the reference Member State that issued the national marketing authorisation on which the mutual recognition procedure is based.&lt;/p&gt;&lt;p&gt;At the end of the mutual recognition procedure, a national marketing authorisation will be issued in the concerned Member State(s). The harmonisation is maintained through the procedures of Regulation (EC) No 1234/2008 for the examination of variations and the use of the decentralised and mutual recognition procedures for extensions and renewals.&lt;/p&gt;&lt;p&gt;For further details see chapter 2.&lt;/p&gt;&lt;p&gt;3.3 Procedure for homeopathic medicinal products According to Article 13 of Directive 2001/83/EC, Member States have to ensure that homeopathic medicinal products placed on the market within the Union are either registered according to Articles 14 and 15 or authorised according to Article 16 of that directive.18&lt;/p&gt;&lt;p&gt;It follows from Article 1(5) of Directive 2001/83/EC that a homeopathic medicinal product is any medicinal product prepared from substances called homeopathic stocks in accordance with a homeopathic manufacturing procedure described by the European Pharmacopoeia19 or, in the absence thereof, by the pharmacopoeias currently used officially in the Member States. A homeopathic medicinal product may contain a number of principles.&lt;/p&gt;&lt;p&gt;Based on the particular characteristics of homeopathic medicinal products, such as the very low level of active principles they contain and the difficulty of applying to them the conventional statistical methods relating to clinical trials, Articles 14 and 15 of Directive 2001/83/EC provide for a simplified registration procedure for those homeopathic medicinal products which are placed on the market without therapeutic indications in a pharmaceutical form and dosage which do not present a risk for the patient. Furthermore, according to Article 13(2) of Directive 2001/83/EC, the Member States are obliged to establish the abovementioned simplified registration procedure for the homeopathic medicinal products referred to in Article 14.&lt;/p&gt;&lt;p&gt;18 As Directive 2001/83/EC provides for a complete harmonisation of national authorisation procedures for medicinal products, no other procedures can be set up for homeopathic medicinal products but the ones provided by Directive 2001/83/EC, see ECJ-Case C-84/06.&lt;/p&gt;&lt;p&gt;19 See section 5.1.2&lt;/p&gt;&lt;p&gt;18 ```&lt;/p&gt;&lt;h2 id=&quot;s21&quot;&gt;原PDF第 19 頁&lt;/h2&gt;&lt;p&gt;```text However, if a homeopathic medicinal product is not eligible for the simplified registration procedure, before placing the product on the market of a Member State, it has to be authorised, regardless of the marketing authorisation procedure in accordance with Articles 8, 10, 10a, 10b, 10c and 11 of Directive 2001/83/EC as appropriate.&lt;/p&gt;&lt;p&gt;Nevertheless, in accordance with Article 16(2) of Directive 2001/83/EC, in case of a national procedure, a Member State may introduce or retain in its territory specific rules for the pre-clinical tests and clinical trials of homeopathic medicinal products other than those referred to in Article 14(1) in accordance with the principles and characteristics of homeopathy as practised in that Member State. Accordingly, if the homeopathic medicinal product is eligible for the simplified registration procedure, the Member State cannot introduce other requirements than the ones following from Articles 14 and 15 of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;An application under the simplified registration procedure may cover a series of medicinal products derived from the same homeopathic stock or stocks. The simplified registration procedure allows the registration of homeopathic medicinal products, provided that they are administered orally or externally, that no specific therapeutic indication appears on the labelling of the medicinal product or in any information relating thereto, and that there is a sufficient degree of dilution to guarantee the safety of the medicinal product.&lt;/p&gt;&lt;p&gt;In addition, in order to demonstrate, in particular, the pharmaceutical quality and the batch-to batch homogeneity of the products concerned, the applicant has to provide the documents set up by Article 15 of Directive 2001/83/EC.&lt;/p&gt;&lt;p&gt;According to Article 14(2) of Directive 2001/83/EC the criteria and rules of procedure provided for in Article 17(1) of that directive apply by analogy to the special, simplified registration procedure for homeopathic medicinal products. Hence, an application under the simplified registration procedure must be assessed within 210 days after the submission of a valid application.&lt;/p&gt;&lt;p&gt;However, it follows from Article 39 of Directive 2001/83/EC that Article 29(4), (5) and (6) and Articles 30 to 34 do not apply to the homeopathic medicinal products registered under the simplified registration procedure. Consequently, if a Member State cannot approve the assessment under the simplified registration procedure conducted by the reference member state, on the grounds of potential serious risk to public health, and the Member States fail to reach an agreement in the coordination group, the case will not be submitted to the EMA for arbitration. Each Member State will therefore take its own decision.&lt;/p&gt;&lt;p&gt;According to Article 68 of Directive 2001/83/EC, homeopathic medicinal products must be labelled in accordance with the provisions of title V of Directive 2001/83/EC on the labelling and package leaflet, and be identified by a reference on their labels, in clear and legible form, to their homeopathic nature. However, it follows from Article 69 of Directive 2001/83/EC that in addition to the clear mention of the words &quot;homeopathic medicinal product&quot;, the labelling and, where appropriate, the package leaflet for homeopathic medicinal products authorised under the simplified&lt;/p&gt;&lt;p&gt;19 ```&lt;/p&gt;&lt;h2 id=&quot;s22&quot;&gt;原PDF第 20 頁&lt;/h2&gt;&lt;p&gt;```text registration procedure must bear no other information than those mentioned in Article 69 of that Directive.&lt;/p&gt;&lt;p&gt;However, the principles and the procedural rules of title V of Directive 2001/83/EC will apply to those products. Hence, according to Article 56, the particulars referred to in Article 69 must be easily legible, clearly comprehensible and indelible. Furthermore, as there is no waiver from the Braille requirements laid down by Article 56a of the Directive with regard to homeopathic medicinal products registered through the simplified procedure, these requirements apply also to homeopathic medicinal products. However, this requirement has to be read in conjunction with Article 69(1) of Directive 2001/83/EC, which provides that the labelling and, where appropriate, the package leaflet for the homeopathic medicinal products registered through the simplified procedure, must bear only the information provided by that article. Accordingly, the scientific name of the stock or stocks followed by the degree of dilution should be put in Braille format on the packaging of the product. If the scientific names of the stocks on the labelling are supplemented by an invented name, this should also be put in Braille format.&lt;/p&gt;&lt;p&gt;According to Article 58 of Directive 2001/83/EC, the inclusion in the packaging of all medicinal products of a package leaflet is obligatory, unless all the information required is directly conveyed on the outer packaging or on the immediate packaging. Furthermore, according to Article 56a of the said directive, the marketing authorisation holder hall ensure that the package leaflet is made available on request from patients' organisations, in formats appropriate for the blind and partially sighted. Consequently, if package leaflets are needed for homeopathic medicinal products registered through the simplified procedure, they are also to be made available in formats appropriate for the blind and partially-sighted.&lt;/p&gt;&lt;p&gt;3.4    Procedure for traditional                 herbal      medicinal       products (traditional-use registration) In order to overcome difficulties encountered by Member States in applying in the same way the pharmaceutical legislation to herbal medicinal products, specific provisions have been introduced in the Union code relating to medicinal products for human use for traditional herbal medicinal products. According to Articles 16a to 16i of Directive 2001/83/EC, a specific registration procedure is foreseen for herbal medicinal products fulfilling the criteria of a traditional herbal medicinal product.&lt;/p&gt;&lt;p&gt;That registration procedure is intended for herbal medicinal products with a long tradition, which do not fulfil the requirements for a marketing authorisation, including those set out in Article 10a of Directive 2001/83/EC. In particular where an applicant cannot demonstrate by detailed references to published scientific literature that the constituent or the constituents of the medicinal products has or have a well- established medicinal use with recognised efficacy and an acceptable level of safety.&lt;/p&gt;&lt;p&gt;The simplified procedure allows the registration of herbal medicinal products without requiring particulars and documents on tests and trials on safety and efficacy,&lt;/p&gt;&lt;p&gt;20 ```&lt;/p&gt;&lt;h2 id=&quot;s23&quot;&gt;原PDF第 21 頁&lt;/h2&gt;&lt;p&gt;```text provided that there is sufficient evidence of the medicinal use of the product throughout a period of at least 30 years, including at least 15 years in the Union.&lt;/p&gt;&lt;p&gt;According to Article 16c(1)(c) of Directive 2001/83/EC bibliographical or expert evidence to the effect that the medicinal product in question, or a corresponding product has been in medicinal use throughout a period of at least 30 years preceding the date of the application, including at least 15 years within the Union. Medicinal use which has taken place on the territory of a new Member State is to be taken into account for the purpose of application of Article 16c(1)(c) even if it has partly or fully occurred before the accession of that State to the European Union.&lt;/p&gt;&lt;p&gt;Applications for registration of traditional herbal medicinal products have to fulfil the same requirements as applications for a marketing authorisation with regard to the manufacturing of these products and their quality.&lt;/p&gt;&lt;p&gt;The long tradition makes it possible to reduce the need for clinical data, in so far as the efficacy of the medicinal product is plausible on the basis of its long-standing use and experience as testified by bibliographic or expert evidence.&lt;/p&gt;&lt;p&gt;Indications must be exclusively appropriate to traditional herbal medicinal products, which by virtue of their composition and purpose, are intended and designed for use without the supervision of a medical practitioner for diagnostic purposes or for prescription or monitoring of treatment. However, to prevent treatment of more serious pathologies with traditional herbal medicinal products, it is possible for the indications of traditional herbal medicinal products to refer to the use after exclusion of serious conditions by a medical doctor. In any case, the traditional herbal medicinal product still needs to be intended and designed for use without the supervision of a medical practitioner for diagnostic purposes or for prescription or monitoring of treatment. The traditional herbal medicinal product has to be a non-prescription medicinal product.&lt;/p&gt;&lt;p&gt;Applicants must substantiate the safety of the medicinal product by the means of a bibliographic review of safety data together with an expert report, complemented by any necessary data, which the Member State’s competent authority may request.&lt;/p&gt;&lt;p&gt;Results of pharmaceutical (physico-chemical, biological or microbiological) tests must be submitted to demonstrate the quality of the traditional herbal medicinal product.&lt;/p&gt;&lt;p&gt;The presence in herbal medicinal products of vitamins and minerals, the safety of which is well documented, does not prevent these products to be eligible for registration, provided that the action of the vitamins/minerals is ancillary to that of the herbal active ingredients regarding the specified claimed indications.&lt;/p&gt;&lt;p&gt;Having regard to the particularities of herbal medicinal products, a Committee for Herbal Medicinal Products (HMPC) has been established at the EMA in accordance with Article 16h of Directive 2001/83/EC. The HMPC is responsible for various tasks concerning the simplified registration and authorisation of medicinal products as provided for in Directive 2001/83/EC and in Regulation (EC) No 726/2004, including involvement in referral procedures concerning such products.&lt;/p&gt;&lt;p&gt;21 ```&lt;/p&gt;&lt;h2 id=&quot;s24&quot;&gt;原PDF第 22 頁&lt;/h2&gt;&lt;p&gt;```text With a view to further facilitating the registration of certain traditional herbal medicinal products in the EU, a list of herbal substances, preparations and combinations thereof for use in traditional herbal medicinal products is established on the basis of the scientific opinion of the HMPC. Applicants can refer to the list, however they would still need to demonstrate the quality of the medicinal products they seek to register.&lt;/p&gt;&lt;p&gt;Another major task of the HMPC is to establish Union herbal monographs for the application of both the traditional use and well-established use provisions and to serve as a basis for simplified registration or bibliographical marketing authorisation applications. When monographs have been established, they must be taken into account by the Member State when examining an application. Accordingly, even though the Member States are not obliged to follow the monograph, any decisions to not accept the content of the monograph as adopted by the HMPC should be duly justified taking into account the important role of monographs to bring harmonisation to this field, and to facilitate the use of the simplified registration procedure.&lt;/p&gt;&lt;p&gt;In order to promote harmonisation, Member States should recognise registrations of traditional herbal medicinal products granted by another Member State based on Union herbal monographs or consisting of substances, preparations or combinations thereof contained in the above-mentioned list. For other products, Member States should take due account of such registrations.&lt;/p&gt;&lt;p&gt;3.5     Paediatric requirements for medicinal products Regulation (EC) No. 1901/200620 of the European Parliament and of the Council on medicinal products for pediatric use entered into force on 26 January 2007. It aims to facilitate the development and availability of medicinal products for use in the paediatric population21. To attain this goal, the Regulation places on applicants certain obligations, the main one being submission of data on the use of a medicinal product in children obtained in accordance with an agreed paediatric investigation plan (PIP) by EMA. Provided that the requirements of Regulation 1901/2006 are fulfilled, the applicants may be then eligible for a reward, as provided in Title V of this Regulation, that may be an extension of the supplementary protection certificate (SPC), extension of market exclusivity, or data/market protection, as the case may be.&lt;/p&gt;&lt;p&gt;For further detail, please refer to the Commission's Guideline on the format and content of applications for agreement or modification of a paediatric investigation plan and requests for waivers or deferrals and concerning the operation of the compliance check and on criteria for assessing significant studies22, available at http://eur- lex.europa.eu/LexUriServ/LexUriServ.do?uri=OJ:C:2008:243:0001:0012:EN:PDF&lt;/p&gt;&lt;p&gt;Additionally, Regulation 1901/2009 provides for a specific authorisation for medicinal products developed exclusively for use in the paediatric population: the&lt;/p&gt;&lt;p&gt;20 OJ L 378, 27.12.2006, p. 1 21 'paediatric population' means that part of the population aged between birth and 18 years&quot;, Article 2, point 1 of Regulation 1901/2006. 22 OJ C 243 of 24/09/ 2008, p. 1.&lt;/p&gt;&lt;p&gt;22 ```&lt;/p&gt;&lt;h2 id=&quot;s25&quot;&gt;原PDF第 23 頁&lt;/h2&gt;&lt;p&gt;```text paediatric use marketing authorisation – PUMA as defined in Article 2.4 of the Regulation. This authorisation can be requested for a medicinal product no longer covered by intellectual property rights and may retain the existing brand name of the corresponding adult product. Medicinal products that have received a PUMA will benefit from the data and marketing protection periods set out in Directive 2001/83/EC (Article 38(2) of Regulation (EC) 1901/2006).&lt;/p&gt;&lt;p&gt;For     information  on    guidelines    developed    by    the    CMDh,       see http://www.hma.eu/216.html. For information on guidelines developed by the EMA, see section “Special Topics-Medicines for children on the EMA website http://www.ema.europa.eu/ema/index.jsp?curl=pages/special_topics/general/general_ content_000302.jsp&amp;amp;murl=menus/special_topics/special_topics.jsp&amp;amp;mid=WC0b01ac 058002d4ea&lt;/p&gt;&lt;p&gt;3.6    Independent national procedures Independent national procedures will continue, but are strictly limited to medicinal products which are not to be authorised in more than one Member State.&lt;/p&gt;&lt;p&gt;In addition, as provided for in Article 30(2) of Directive 2001/83/EC, harmonisation of authorisations for medicinal products authorised in the Union is to be promoted via a coordinated approach for referring medicinal products, for which divergent decisions have been adopted, to the EMA and the Committee for Medicinal Products for Human Use (see section 4).&lt;/p&gt;&lt;p&gt;Independent national procedures can also be used for extensions of authorised medicinal products as far as no a priori harmonisation has been achieved for the initial marketing authorisation (see section 7 of this chapter).&lt;/p&gt;&lt;p&gt;3.7    Procedures according to Article 126a of Directive 2001/83/EC In order to increase availability of medicinal products, in particular on smaller markets, Article 126a of Directive 2001/83/EC provides that, in the absence of a marketing authorisation or of a pending application for authorisation for a medicinal product, which has already been authorised in another Member State, a Member State may for justified public health reasons authorise the placing on the market of that medicinal product. In such cases, the competent authority of the Member State has to inform the marketing authorisation holder in the Member State in which the medicinal product concerned is authorised, of the proposal to authorise the placing on the market under this Article.&lt;/p&gt;&lt;p&gt;When a Member State avails itself of this possibility, it must adopt the necessary measures in order to ensure that the requirements for the labelling and package leaflet, classification of the medicinal product, advertising, pharmacovigilance and supervision and sanctions are complied with. For the specific mechanisms chosen by the Member States to implement this provision, we refer to the relevant national legislation. .&lt;/p&gt;&lt;p&gt;23 ```&lt;/p&gt;&lt;h2 id=&quot;s26&quot;&gt;原PDF第 24 頁&lt;/h2&gt;&lt;p&gt;```text The register of the medicinal products authorised under Article 126a is available at the    Commission      web-site:   http://ec.europa.eu/health/documents/community- register/html/except_index.htm&lt;/p&gt;&lt;p&gt;For medicinal products authorised in accordance with Article 126a of Directive 2001/83/EC, marketing authorisation holders do not qualify for the rewards in the sense of Regulation 1901/2006 as described in section 3.5 above.&lt;/p&gt;&lt;p&gt;24 ```&lt;/p&gt;&lt;h2 id=&quot;s27&quot;&gt;原PDF第 25 頁&lt;/h2&gt;&lt;p&gt;```text 4.     UNION REFERRALS In certain circumstances in the framework of marketing authorisations granted by the competent authorities of the Member States, a Union procedure, involving a scientific opinion by, as appropriate, the CHMP/Pharmacovigilance Risk Assessment Committee (PRAC) can be triggered. This procedure is commonly called Union “referral”, which may be triggered in the cases listed below and which are further described in chapter 3 of volume 2A of the Notice to applicant:&lt;/p&gt;&lt;p&gt;i)      in accordance with Article 29 of Directive 2001/83/EC, where one or more concerned Member States cannot agree on the recognition of an authorisation already granted in a mutual recognition procedure or a final assessment and product information prepared by the Reference Member State in view of granting the marketing authorisation in a decentralised procedure due to a potential serious risk to public health23, the points of disagreement must be referred to the coordination group provided by Article 27 of that Directive..&lt;/p&gt;&lt;p&gt;Where the Member States concerned by the procedure fail to reach an agreement within the coordination group, the matter is referred to the CHMP for application of the procedure laid down in Articles 32 to 34 of Directive 2001/83/EC. This referral is automatic in the sense that, once a Member State has raised a concern on the grounds of potential serious risk to public health within the meaning of Article 29(1), withdrawal of the marketing authorisation application in that Member State does not prevent the concern from being analysed within the coordination group and, in absence of an agreement therein, the EMA. The expression ‘potential serious risk to public health’ is defined in the Commission's Guideline on the definition of a potential serious risk to public health in the context of Article 29(1) and (2) of Directive 2001/83/EC 24, available at http://ec.europa.eu/enterprise/sectors/pharmaceuticals/files/eudralex/vol- 1/com_2006_133/com_2006_133_en.pdf&lt;/p&gt;&lt;p&gt;ii)     in accordance with Article 30(1) of Directive 2001/83/EC, if two or more applications submitted in accordance with Article 8, 10, 10a, 10b 10c and 11 of that Directive have been made for marketing authorisation for a particular medicinal product, and if Member States have adopted divergent decisions concerning the authorisation of the medicinal product or its suspension or revocation, a Member State, the Commission or applicant or the marketing authorisation holder may refer the matter to the Committee for Medicinal Products for Human Use, […], for the application of the procedure laid down in Articles 32, 33 and 34;&lt;/p&gt;&lt;p&gt;iii)    in accordance with Article 30(2) of Directive 2001/83/EC, in order to promote harmonisation of authorisations for medicinal products authorised in the Union, Member States must, each year, forward to the coordination group a list of medicinal products for which a harmonised summary of product&lt;/p&gt;&lt;p&gt;23 See ECJ C-452/06. 24 OJ C 133, 8/6/2006 p. 5 - 7&lt;/p&gt;&lt;p&gt;25 ```&lt;/p&gt;&lt;h2 id=&quot;s28&quot;&gt;原PDF第 26 頁&lt;/h2&gt;&lt;p&gt;```text characteristics should be drawn up. The coordination group must lay down a list taking into account the proposals from all Member States and will forward this list to the Commission. The Commission or a Member State, in agreement with the Agency and taking into account the views of interested parties, may refer these products to the Committee […]&lt;/p&gt;&lt;p&gt;iv)     in accordance with Article 31 of Directive 2001/83/EC25, the Member States or the Commission or the applicant or the marketing authorisation holder must, in specific cases where the interests of the Union are involved, refer the matter to the Committee for the application of the procedure laid down in Articles 32, 33 and 34 before any decision is reached on a request for a marketing authorisation or on the suspension or revocation of an authorisation, or any other variation to the terms of a marketing authorisation which appears necessary. Where the referral results from the evaluation of data relating to pharmacovigilance the matter must be referred to the PRAC. Its final recommendation will be forwarded to the CHMP or the coordination group, as appropriate. . However when one of the criteria listed in Article 107i(1) is met, the procedure laid down in Articles 107i to 107k must apply. Where the referral concerns a range of medicinal products or a therapeutic class, the Agency may limit the procedure to certain specific parts of the authorisation. In such case, Article 35 must apply to those medicinal products only if they were covered by the authorisation procedures referred to in this chapter [decentralised and mutual recognition procedures].&lt;/p&gt;&lt;p&gt;v)      in accordance with Article 107i of Directive 2001/83/EC26 A Member State or the Commission, as appropriate, must, on the basis of concerns resulting from the evaluation of data from pharmacovigilance activities:&lt;/p&gt;&lt;p&gt;a) initiate the procedure provided for in the section by informing the other Member States, the Agency and the Commission where it considers suspending or revoking a marketing authorisation, prohibiting the supply of a medicinal product, refusing the renewal of a marketing authorisation, or it is informed that the marketing authorisation holder, on the basis of safety concerns, has interrupted the placing on the market of a medicinal product or has taken action to have a marketing authorisation withdrawn, or intends to take such action or has not applied for the renewal of a marketing authorisation.&lt;/p&gt;&lt;p&gt;b) inform the other Member States, the Agency and the Commission where it considers that a new contraindication, a reduction in the recommended dose or a restriction to the indications of a medicinal product is necessary. The information must outline the action considered and the reasons therefor.&lt;/p&gt;&lt;p&gt;c) initiate the procedure in any of the cases referred in the paragraph b&lt;/p&gt;&lt;p&gt;25 Article 1.2 of Directive 2012/26/EU amending Article 31 of Directive 2001/83/EC, applicable as from 28 October 2013. 26 Article 1.7 of Directive 2012/26/EU amending Article 31 of Directive 2001/83/EC, applicable as from 28 October 2013.&lt;/p&gt;&lt;p&gt;26 ```&lt;/p&gt;&lt;h2 id=&quot;s29&quot;&gt;原PDF第 27 頁&lt;/h2&gt;&lt;p&gt;```text above, when urgent action is considered necessary.&lt;/p&gt;&lt;p&gt;vi)        in accordance with Article 13 of Commission Regulation 1234/2008
