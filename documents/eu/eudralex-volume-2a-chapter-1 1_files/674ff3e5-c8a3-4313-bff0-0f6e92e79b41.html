ould clearly identify the reference product in order for the reference Member State, in case of MRP/DCP, to prepare the assessment report.</p><p>In addition, marketing authorisations granted under exceptional circumstances in accordance with Article 14(8) of Regulation (EC) No 726/2004 or Article 22 of Directive 2001/83/EC can be used as a reference medicinal product provided that all other requirements for granting a generic marketing authorisation under Article 10 are fulfilled. Such generic marketing authorisation is normally not granted under Article 14(8) of Regulation (EC) No 726/2004 or Article 22 of Directive 2001/83/EC but any specific obligation imposed on the reference medicinal product which is deemed appropriate also for the generic product should be imposed also as a condition to the generic marketing authorisation subject to annual review where appropriate. The decision on the imposition or not of any obligations of the reference medicinal product on the generic should be made on a case-by-case basis, it should follow the principles applied for generics of medicinal products for which conditions to the marketing authorisation have been imposed and it should fully take into account that the reference medicinal product is authorised under exceptional circumstances and that particulars of that reference medicinal product are as yet inadequate in certain specified respects. In this regard, it is recalled that the primary purpose of the specific obligations is to mitigate public health risk following from an authorisation based on less than comprehensive data. The Product Information should also draw the attention of the medical practitioners to the fact that the product refers to a reference medicinal product authorised under exceptional circumstances and that particulars of that reference medicinal product are as yet inadequate in certain specified respects.</p><p>If during the lifecycle of the generic product it is confirmed that the risk-benefit balance of the reference medicinal product authorised under exceptional circumstances is not favourable and the marketing authorisation of that reference medicinal product is withdrawn, suspended or revoked, the same action would be required also towards the generic medicinal products of that reference medicinal product.</p><p>On the contrary, reference cannot be made to the dossier of a medicinal product for which a marketing authorisation has been granted in the Union in accordance with</p><p>27 Ca se C-104-13, E CJ 23/10/2014</p><p>30 ```</p><h2 id=\"s33\">原PDF第 31 頁</h2><p>```text Article 10(1).Data supporting applications approved under Article 10(3) (e.g new indications, strength, route of administration, pharmaceutical form) do not benefit from periods of exclusivity, except when specifically provided for new therapeutic indications in Article 10(5). For example, Product B (Company 2) was approved according to Article 10(3) based on additional preclinical and/or clinical studies (e.g. supporting a new indication, strength, pharmaceutical form or route of administration) to those submitted in support of the reference product (Product A, Company 1). A subsequent application may be submitted for Product C (Company 3), which refers to data supporting the reference product (Product A) and also to the data submitted in support of Product B (approved according to Article 10(3)), provided that any data exclusivity awarded in respect of a possible new therapeutic indication for Product B has elapsed. The application for Product C may be accepted irrespective of whether Products A and B belong to the same global marketing authorisation. In such case Product A would be the reference medicinal product in support of the application for Product C. Applicants proposing such a marketing authorisation application are advised to contact the competent authorities in advance of the submission. The same principle applies if Product B was approved according to Article 10(1), but where the marketing authorisation was subsequently amended to include a new indication post- authorisation.</p><p>Reference must be made to a product which is or has been authorised in the Union, (i.e. a marketing authorisation has been granted for the reference medicinal product, but it may have ceased to exist) and in accordance with the Union law28.</p><p>In case, the reference medicinal product is no more produced and placed on the Union market , demonstration of the bioequivalence with the reference medicinal product through bioavailability studies should however be performed on batches which have been authorised within the Union.</p><p>Application in accordance with Article 10 refers to information that is contained in the dossier of the authorisation of the reference product. This information is generally not completely available in the public domain. These authorisations for these medicinal products are therefore linked to the ‘original’ authorisation. This does not however mean that withdrawal of the authorisation for the reference product leads to the withdrawal of the authorisation for the generic product. However, where the reference medicinal product has been withdrawn, it is noted that public health concerns linked for instance to the lack of pharmacovigilance data may prevent the granting of such marketing authorisation. (case C-223/01, AstraZeneca, judgment of the European Court of Justice of 16 October 2003).</p><p>An application according to Article 10 of Directive 2001/83/EC cannot be filed simultaneously with an application for a reference product         (case C-223/01, AstraZeneca, judgment of the European Court of Justice of 16 October 2003).</p><p>The marketing authorisation holder of the reference medicinal product can file an application on the basis of Article 10 to his own medicinal product, provided that the requirements of Article 10 are fulfilled, for example the data exclusivity period has expired. It should be noted that in case of centralised application, Article 82(1) of</p><p>28 Case C-527/07, ECJ 18/06/2009</p><p>31 ```</p><h2 id=\"s34\">原PDF第 32 頁</h2><p>```text Regulation 726/2004 applies (see section 2.7) For National/DC/MR procedures, see section 2.7.</p><p>5.3.1.2 “European reference medicinal product”</p><p>According to Article 10(1), third subparagraph of Directive 2001/83/EC a generic application can also be submitted in a Member State although the reference medicinal product has never been authorised in that Member State. In that case, a reference medicinal product in another Member State should be identified, so-called the European reference medicinal product.</p><p>In these cases, the applicant has to identify in the application form the name of the Member State in which the reference medicinal product is or has been authorised. It is also a prerequisite that the period of data exclusivity has expired in the Member State of the reference medicinal product (see section 6).</p><p>At the request of the competent authority of the Member State in which the application is submitted, the competent authority of the other Member State should transmit, within a period of one month, a confirmation that the reference medicinal product is or has been authorised together with the full composition of the reference product and if necessary other relevant documentation.</p><p>The documentation requested must be relevant for the assessment of the application submitted on the basis of Article 10 (see CMD(h) working document - information to be submitted by the Member State of the European reference medicinal product at http://www.hma.eu/uploads/media/ERP_information.pdf)</p><p>5.3.1.3 Reference medicinal product not harmonised in the European Union</p><p>For historical reasons, the reference product identified in the procedure may have marketing authorisations with different SmPC across the EU (horizontal disharmony of the reference medicinal product). This should not prevent that the medicinal product authorised on the basis of Article 10 has the same SmPC across the EU (horizontal harmonisation of the generic medicinal product). Concerned Member States should endeavour to recognise the assessment performed by the Reference Member State, except where they have concerns as to the existence of a potential serious risk for public health as regards the content of application considered.</p><p>5.3.2 Particularities for application according to Article 10</p><p>Article 10 constitutes a single legal base for the submission of applications. The content of such applications must comply with the requirements set out therein.</p><p>5.3.2.1 Application in accordance with paragraph 1 of Article 10 (generic medicinal product)</p><p>Directive 2001/83/EC defines a generic medicinal product in Article 10(2)(b) as a medicinal product which has:</p><p>32 ```</p><h2 id=\"s35\">原PDF第 33 頁</h2><p>```text    the same qualitative and quantitative composition in active substances as the reference medicinal product,</p><p>   the same pharmaceutical form as the reference medicinal product,</p><p>   and whose bioequivalence with the reference medicinal product has been demonstrated by appropriate bioavailability studies.</p><p>The different salts, esters, ethers, isomers, mixtures of isomers, complexes or derivatives of an active substance must be considered to be the same active substance, unless they differ significantly in properties with regard to safety and/or efficacy. In such cases, additional information providing proof of the safety and/or efficacy of the various salts, esters, ethers, isomers or mixtures thereof or derivatives of an authorised active substance must be supplied by the applicant. If additional information concerning changes to the nature of the active substance cannot establish the absence of a significant difference with regard to safety or efficacy then it would be necessary to submit the results of appropriate pre-clinical tests and clinical trials in accordance with the requirements of Article 10(3) (see section 5.3.5). To the extent that the active substance may be considered as a new active substance as defined in Annex I at the end of this Chapter, the applicant may consider the submission of an application in accordance with Article 8(3) of Directive 2001/83/EC.</p><p>The various immediate-release oral pharmaceutical forms are considered to be one and the same pharmaceutical form. Bioavailability studies need not be required of the applicant if he can demonstrate that the generic medicinal product meets the relevant criteria as defined in the detailed 'guideline on the investigation of bioequivalence' 29(see also Annex I of this Chapter).</p><p>The competent authorities will determine the validity of such applications on a case by case basis and will rely upon the summary evidence provided in Modules 1 and 2 of the application dossier and, if available, on the assessment report of another competent authority.</p><p>‘Same qualitative and quantitative composition’</p><p>This requirement that the generic and reference products have the same qualitative and quantitative composition extends only to the active substance(s) and not to the other ingredients of the product. However, differences in excipient composition or differences in impurities must not lead to significant differences as regards safety and efficacy. The competent authorities will evaluate these differences in the light of all scientific knowledge at their disposal. See also ruling of the European Court of Justice in case C-74/03, Smithkline Beecham, judgment of 20 January 2005.</p><p>29http://www.ema.europa.eu/docs/en_GB/document_library/Scientific_guideline/2010/01/WC5000700 39.pdf</p><p>33 ```</p><h2 id=\"s36\">原PDF第 34 頁</h2><p>```text The decision whether a different form of the active substance is to be regarded as a new active substance should be taken by the competent authorities on a case-by-case basis.</p><p>‘Same pharmaceutical form’</p><p>This criterion relating to the same pharmaceutical form contained in the definition of generic medicinal product is evaluated taking into consideration the standard terms for pharmaceutical dosage forms established by the European Pharmacopoeia. A generic product and a reference product may be considered to have the same pharmaceutical form if they have the same form of administration as defined by the Pharmacopoeia. Furthermore, Article 10(2)(b) of the amended Directive provides that the various immediate release oral forms, which would include tablets, capsules, oral solutions and suspensions, are considered to be the same pharmaceutical form for the purposes of Article 10.</p><p>According to the European Court of Justice, in determining the pharmaceutical form of a medicinal product, account must be taken of the form in which it is presented and the form in which it is administered, including the physical form. In that context, medicinal products which are presented in the form of a solution to be mixed in a drink for administration to the patient, and which after mixing form different solutions to be administrated, as for example a macroemulsion and a microemulsion, are to be treated as having the same pharmaceutical form, provided that the differences in the form of administration are not significant in scientific terms. (See Case C-106/01, Novartis, judgment of 29 April 2004).</p><p>‘Bioequivalence’</p><p>The definition and demonstration of bioequivalence should be made in accordance with the CHMP 'guidelines on the investigation of bioequivalence' available at http://www.ema.europa.eu/docs/en_GB/document_library/Scientific_guideline/2010/ 01/WC500070039.pdf</p><p>Article 10(2)b last sentence of Directive 2001/83/EC states: \"[…]Bioavailability studies need not be required of the applicant if he can demonstrate that the generic medicinal product meets the relevant criteria as defined in the appropriate detailed guidelines\".</p><p>Such exemptions from the need to demonstrate bioequivalence should be justified in module 1 of the dossier and in the clinical overviews.</p><p>Where bioequivalence cannot be demonstrated through bioavailability studies Article 10(3) requires that the results of appropriate pre-clinical tests or clinical trials will be provided.</p><p>5.3.2.2 Application in accordance            with    paragraph      3    of   Article    10 (\"hybrid\"medicinal product)</p><p>Article 10(3) of Directive 2001/83/EC requires that, in certain circumstances in the framework of an application under Article 10, the results of the appropriate pre- clinical tests or clinical trials shall be provided. These applications will thus rely in</p><p>34 ```</p><h2 id=\"s37\">原PDF第 35 頁</h2><p>```text part on the results of pre-clinical tests and clinical trials for a reference product and in part on new data.</p><p>The extent of the additional studies required in the framework of an article 10(3) application depends on the changes introduced vis-à-vis the reference medicinal product (e.g. new strength, new route of administration, new therapeutic indication) and will be a matter of scientific assessment by the relevant competent authority.</p><p>In such cases the results of tests and trials supplied must be consistent with the data content standards required in the Annex to the Directive 2001/83/EC as amended by Directive 2003/63/EC.</p><p>Article 10(3) considers three circumstances where such additional data will be necessary:</p><p>   where the strict definition of a ‘generic medicinal product’ is not met;</p><p>   where bioavailability studies cannot be used to demonstrate bioequivalence (for example where the new product is supra-bioavailable or for locally applied/locally acting medicinal products);</p><p>   where there are changes in the active substance(s), therapeutic indications, strength, pharmaceutical form or route of administration of the generic product compared to the reference product.</p><p>Some guidance on the appropriate additional studies required is indicated in the table given in Annex II at the end of this Chapter.</p><p>In any event Article 10(3) should not be used as a legal basis for applications for products for which it is possible to demonstrate bioequivalence through bioavailability studies but the applicant failed to submit results of such studies demonstrating bioequivalence.</p><p>5.3.2.3 Application in accordance with paragraph 4 of Article 10 (\" Similar biological medicinal product\")</p><p>Article 10(4) of Directive 2001/83/EC requires that in the framework of an application under Article 10, where a biological medicinal product which is similar to a reference biological product, does not meet the conditions in the definition of generic medicinal products, owing to, in particular, differences relating to raw materials or differences in manufacturing processes of the similar biological medicinal product and the reference biological medicinal product, the results of appropriate pre-clinical tests or clinical trials relating to these conditions must be provided. The type and quantity of supplementary data to be provided must comply with the relevant criteria stated in Annex I of Directive 2001/83/EC and the related detailed guidelines. The results of other tests and trials from the reference medicinal product's dossier must not be provided. Guidance is available at the website of the EMA http://www.ema.europa.eu.</p><p>35 ```</p><h2 id=\"s38\">原PDF第 36 頁</h2><p>```text With the aim of facilitating the global development of biosimilars and to avoid unnecessary repetition of clinical trials, it may be possible for an Applicant to compare the biosimilar in certain clinical studies and in vivo non-clinical studies with a non-EEA authorised comparator which will need to be authorised by a regulatory authority with similar scientific and regulatory standards as EMA or EEA competent authorities (e.g. ICH members). It will be the Applicant’s responsibility to demonstrate that the comparator authorised outside the EEA is representative of the reference product authorised in the EEA. For further information, please refer to the Guideline on similar biological medicinal products available at the website of the EMA http://www.ema.europa.eu .</p><p>5.4    Applications according to Article 10a of Directive 2001/83/EC According to Article 10a of Directive 2001/83/EC it is possible to replace results of the pre-clinical and clinical trials by detailed references to published scientific literature if it can be demonstrated that the active substances of a medicinal product in the claimed therapeutic indication have been in well-established medicinal use within the Union for at least ten years, with recognised efficacy and an acceptable level of safety. In this regard, the provisions of Annex I of Directive 2001/83/EC shall apply. Being a derogation the well-established use provision must be interpreted strictly. The well-established medicinal use legal basis is to be used only in cases where all aspects of the safety and efficacy are demonstrated by reference to published scientific literature. It would derive that it should not be considered as an alternative to other legal basis such as Article 10 of Directive 2001/83/EC. The adequacy of the bibliographic evidence has to be assessed on a case by case basis in the understanding that applications under Article 10a does not lower the requirements of safety and efficacy that must be met.</p><p>With regard to advanced therapies medicinal products (ATMPs) it is important to bear in mind that applications according to Article 10a of Directive 2001/83/EC are acceptable only in so far as the published scientific literature is relevant and sufficient to demonstrate the safety and efficacy profile of the medicinal product which is the object of the application. Because the safety and efficacy profile of ATMPs is determined by the manufacturing process and the starting materials, only literature data that refers to ATMPs manufactured according to the same procedure can be considered, provided that differences in the starting materials do not have an impact on the safety and/or efficacy. Therefore, for ATMPs that have been subject to substantial manipulation, an application under Article 10a is not acceptable unless the manufacturing process of the product reported in the literature and the manufacturing process of the product covered by the application is the same. For most applications concerning ATMPs this will not be the case. However, an application under Article 10a of Directive 2001/83 could be possibly considered for an ATMP that contains or consist of cells that have not been subject to a substantial manipulation as, in such scenario, there is no impact of the manufacturing process on the safety and efficacy profile of the product.</p><p>Well-established medicinal use</p><p>Annex I of Directive 2001/83/EC lays down specific rules for the demonstration of a well-established medicinal use, with recognised efficacy and an acceptable level of safety.</p><p>36 ```</p><h2 id=\"s39\">原PDF第 37 頁</h2><p>```text The following criteria should be taken into account:</p><p>   the time over which a substance has been used with regular application in patients; quantitative aspects of the use of the substance, taking into account the extent to which the substance has been used in practice, the extent of use on a geographical basis and the extent to which the use of the substance has been monitored by pharmacovigilance or other methods;</p><p>   the degree of scientific interest in the use of the substance (reflected in the published scientific literature) and the coherence of scientific assessments;</p><p>Therefore, different periods of time may be necessary for establishing well- established use of different substances. In any case, the period of time required for establishing a well-established medicinal use of a constituent of a medicinal product must not be less than one decade from the first systematic and documented use of that substance as a medicinal product in the Union.</p><p>Evidence must be supplied to demonstrate the systematic and documented use of the active substance, i.e. extensive and continued use over a period of at least 10 years in the Union. Although “medicinal use” does not exclusively mean “use as an authorised medicinal product”, it could constitute a proof of medicinal use. In particular, for active substance used in medicinal products authorised before a State joined the Union or before an authorisation of a Member State was reviewed in accordance with Union law; the use on that territory is to be taken into account for the purpose of application of Article 10a, even if it has partly or fully occurred before the accession of that State.</p><p>Well-established use refers to the use for a specific therapeutic use. If well-known substances are used for entirely new therapeutic indications andit is not possible to solely refer to a well-established use, then additional data on the new therapeutic indication together with appropriate pre-clinical and human safety and/or efficacy data should be provided. In such a case, another legal basis should be used for the marketing authorisation application.</p><p>Whilst data concerning use in clinical trials, compassionate use, named patient supply may be submitted, this cannot replace the requirement to demonstrate a systematic and documented use for that 10 year period in the Union. Where relevant, the prevalence of the condition/disease should be taken into account when demonstrating the extent of use.</p><p>In case of orphan marketing authorisation application the systematic and documented use of a substance can refer, as way of derogation, to the use of that substance in accordance with Article 5 of Directive 2001/83/EC.</p><p>Marketing authorisation applications for fixed combinations intended to be used in patients who are already stabilised on optimal doses of the combination of the same, but separately administered, active substances, taken at the same dose interval and time, can be submitted on the basis of Article 10a. In such cases, the detailed references to published scientific literature submitted must concern the systematic and documented use of the active substances in combination. It is nevertheless possible to include information on the individual active substances in the application. This will</p><p>37 ```</p><h2 id=\"s40\">原PDF第 38 頁</h2><p>```text typically occur where the applicant intends to justify the absence of certain specific data on the combination by reference to the information available on the individual substances.</p><p>Lastly, consideration must be given to the case of herbal medicinal products, which apart from registration can be authorised on the basis of, inter alia, Article 10a of Directive 2001/83/EC. The existence of a EU herbal monograph for herbal substances or herbal preparations with well-established use is considered as demonstrating the systematic use.</p><p>Documentation</p><p>The applicant is encouraged to provide a detailed description of the strategy used for the search of published literature and the justification for inclusion of references in the application. The reference must be made to ‘published scientific literature’. The term ‘published’ literature implies that the text must be freely available in the public domain and published by a reputable source, preferably peer-reviewed. See section 6.1.6.</p><p>It must be stressed that assessment reports such as the EPAR for EU marketing authorisations or similar summary reports from competent authorities inside and outside the EU which are made publicly available by competent authorities for reasons of transparency cannot be considered to meet the requirements of Annex I of Directive 2001/83/EC.</p><p>The documentation and the Overall summaries and Overall overview/summaries submitted by the applicant should cover all aspects of the assessment and must include a review of the relevant literature, taking into account pre- and post-marketing studies and published scientific literature concerning experience in the form of epidemiological studies and in particular of comparative epidemiological studies. All documentation, both favourable and unfavourable, should be communicated. If documentation is lacking, a justification should be given. If parts of the dossier are incomplete, particular attention must be paid to explain in the Overall overview/summaries why.</p><p>When compiling published scientific literature, Applicants should also include post- marketing experience with medicinal products containing the same active substance .</p><p>Copies of the full text of the literature, including necessary translations must be submitted.</p><p>Scientific monographs may offer an overview on published scientific literature which - together with the full texts referred to - may be used in addition to other documents for a bibliographical application. These monographs can help to avoid duplication of work and bring about gradual harmonisation in the evaluation of medicinal products.</p><p>In the specific case of herbal medicinal products, if an EU herbal monograph for well establish use exists the submission of non-clinical and clinical overview/summaries is necessary to explain the relevance of the monograph and/or additional literature for the given application. However, it is not necessary to provide all the articles referred in the List of References supporting the monograph.</p><p>38 ```</p><h2 id=\"s41\">原PDF第 39 頁</h2><p>```text In certain cases, studies may be provided only to support the relevance of the literature (used to demonstrate safety and efficacy of the active substance(s)), to the product intended for marketing. These are considered on a case by case basis by the competent authorities.</p><p>5.5        Application according to Article 10b of Directive 2001/83/EEC In accordance with Article 10b of Directive 2001/83/EC: \"In the case of medicinal products containing active substances used in the composition of authorised medicinal products but not hitherto used in combination for therapeutic purposes, the results of new pre-clinical tests or new clinical trials relating to that combination must be provided in accordance with Article 8(3)(i), but it is not necessary to provide scientific references relating to each individual active substance\".</p><p>The combination of active substances within a single pharmaceutical form of administration according to this provision is a so-called ‘fixed combination’.</p><p>A key principle of the acquis is that there must be a marketing authorisation for each medicinal product that is put on the EU market. Therefore, the fixed combination definition is limited to active substances contained in a same pharmaceutical form of administration, the so-called 'fixed-combination'. The combination of active substances, where active substances are included in separate pharmaceutical forms and presented in a combination pack cannot be considered as fixed combination.</p><p>In very exceptional circumstances, which must be considered on a case by case basis, the marketing of distinct medicinal products in the same package may be indispensable for public health reasons. Such reasons cannot be related to convenience or commercial purposes.</p><p>Marketing authorisations for medicinal products containing more than one active substance in a single pharmaceutical form can be granted on different legal basis. In case of an application on the basis of Article 10b of Directive 2001/83/EC the applicant does not have to provide scientific references relating to each individual active substance.</p><p>For impact on the global marketing authorisations as described in Article 6(1) of Directive 2001/83/EC see section 2.3.</p><p>Applications for fixed-combination medicinal products under Article 10b are conditioned to the fact that the individual substances have been the object of a marketing authorisation in the EEA via a Union or national procedure, even though it is not in the same Member State.</p><p>It follows from the wording of Article 10b as well as from Part II.5 of Annex I to Directive 2001/83/EC that a full dossier comprising all the information of modules 1 to 5 has to be provided in relation to the fixed-combination. The guideline on clinical development of fixed combination medicinal products30 provides guidance on the</p><p>30     DRAF T       Gu ideline      on   clin ica l developm en t     of fixed       com bin a t ion m edicin a l pr odu cts h t t p://www.em a .eur opa .eu/docs/en _GB/docum en t_libr a ry/Scient ific_gu ideline/2015/05/WC500186840.pdf</p><p>39 ```</p><h2 id=\"s42\">原PDF第 40 頁</h2><p>```text clinical elements of such dossier. As with any application for a new medicinal product such a full dossier can be either a dossier based solely on own pre-clinical tests and/or clinical trials or on a mixed dossier taking into account data exclusivity rules.</p><p>Article 10b does not contain a requirement for the inclusion of data on the individual active substances. It is nevertheless possible to include information on the individual substances in the application for a fixed-combination. This will typically occur where the applicant tries to justify the absence of certain specific data on the combination by reference to the information available on the individual substances. Such information could consist of literature or actual data.</p><p>In case the dossier is only composed of references to published scientific literature, the legal basis would not be Article 10b of Directive 2001/83/EC, but possibly 10a if all requirements are fulfilled (see section 5.4).</p><p>5.6    Applications according to Article 10c of Directive 2001/83 /EC A derogation from the requirements to submit all of the information required in Article 8(3)(i) is provided by Article 10c of Directive 2001/83/EC for so-called ‘informed consent’ marketing authorisation applications. Despite the fact that the provision contains some criteria that are common to the definition of a generic medicinal product in Article 10, Article 10c does not concern generic medicinal products.</p><p>According to Article 10c: “Following the granting of a marketing authorisation, the authorisation holder may allow use to be made of the pharmaceutical, preclinical and clinical documentation contained in the file on the medicinal product, with a view to examining subsequent applications relating to other medicinal products possessing the same qualitative and quantitative composition in terms of active substances and the same pharmaceutical form.”</p><p>As Article 11 of Directive 2001/83/EC refers only to application on the basis of Article 10, an informed consent application does not have to cover all presentations/indications of the medicinal product with regard to which consent is given. Consent may be given to use the documentation contained in the file of the relevant medicinal product for a given presentation/indication provided that the application relies on that consent as regards all three modules of the dossier. It is a prerequisite for the use of article 10c that consent has been obtained for all three modules containing the pharmaceutical, preclinical and clinical data. It is not possible to use Article 10c a legal basis for an application consisting of the applicant’s own module 3 and for which consent has been given for modules 4 and 5. In such cases the legal basis for the application is Article 8(3).</p><p>An informed consent application cannot cover more presentations or indications that the medicinal product with regard to which consent is given.</p><p>The concept of \"European reference medicinal product\" is laid down by Article 10 and is applicable in case of application in accordance with Article 10 (see section 5.3.1.2). It does not apply in the context of applications under Article 10c. In addition,</p><p>40 ```</p><h2 id=\"s43\">原PDF第 41 頁</h2><p>```text it should be noted that an informed consent application is only possible if there is still a valid marketing authorisation to which consent is given.</p><p>Furthermore, informed consent applications need to respect the following:    for a central marketing authorisation the informed consent application has to follow the centralised procedure;    for a national marketing authorisation the informed consent application has to follow a national procedure (either pure national or MRP or DCP). A prerequisite is, that the marketing authorisation is granted in this/these MS.</p><p>It follows that an application under Article 10c can only be submitted to a Member State where the medicinal product with regard to which consent is given is authorised. The applicant must show proof that the marketing authorisation holder of the reference product has consented that the dossier of that product is used for the purpose of examining the application in question. It is up to the contracting parties to consider, as a term of their contractual agreement, whether the ‘informed consent’ can be withdrawn by the consenting parties and what the consequences of the withdrawal of the informed consent would be.</p><p>The ‘informed consent’ product applicant must have permanent access to the documentation in order to fully carry out his responsibilities. For the information contained in the Active Substance Master File a new letter of access in connection with the informed consent application should be included, without prejudice to the restrictions on access to the Manufacturer Restricted Part of the Active Substance Master File.</p><p>For competent authorities, demonstration of the ‘informed consent’ is a formal condition which must be fulfilled, when the informed consent application is submitted. An authenticated letter from the party granting consent is required and must specify the name of the benefiting party and the products concerned. The withdrawal of the informed consent at a later stage has no direct consequences on the existence/validity of the marketing authorisation, but the marketing authorisation holder is to take appropriate steps having regard to the requirement of permanent access to the file.</p><p>41 ```</p><h2 id=\"s44\">原PDF第 42 頁</h2><p>```text 6.     DATA EXCLUSIVITY AND MARKET PROTECTION</p><p>6.1 Data exclusivity and market protection period for reference medicinal products</p><p>6.1.1 Principles on data exclusivity and market protection of 'reference medicinal product'</p><p>The medicinal product, once authorised on the basis of Article 10, can however only be placed on the market 10 or 11 years after the authorisation of the reference medicinal product, depending on the protection period applicable for the reference medicinal product. The protection period in the concerned Member State must also be taken into consideration before placing the medicinal product on its market.</p><p>It should be noted, however, that these periods of protection will only apply to applications for reference medicinal products submitted once the provisions of Directive 2004/27/EC and Regulation (EC) No 726/2004 start to apply; see section 6.1.2.</p><p>6.1.2   Data exclusivity and market protection for applications submitted after the implementation of the amended legislation</p><p>Directive 2004/27/EC, amending Directive 2001/83/EC, and Regulation (EC) No 726/2004 have introduced new rules concerning the periods, from the initial marketing authorisation of the reference product, during which generic product applicants cannot rely on the dossier of the reference product for the purposes of submitting an application, obtaining marketing authorisation or placing the product on the market.</p><p>For products authorised by the national competent authorities, according to the first subparagraph of Article 10(1) of Directive 2001/83/EC as amended by Directive 2004/27/EC, the applicant is not required to provide the results of pre-clinical tests and of clinical trials if he can demonstrate that the medicinal product is a generic of a reference medicinal product which is or has been authorised under Article 6 for not less than eight years in a Member State or in the Union.</p><p>According to the second subparagraph of Article 10(1), generic products authorised in this way must not be placed on the market until ten years have elapsed from the initial authorisation of the reference product. (This ten year period may be extended to eleven if the conditions of the fourth subparagraph of Article 10(1) are fulfilled, see section 6.2 below).</p><p>The period of eight years from initial authorisation of the reference product provides a period of so-called “data exclusivity”, after which valid applications for generic products can be submitted and lead to the granting of a marketing authorisation. The period of ten years from initial authorisation of the reference product provides a period of so-called “market protection” after which generic products authorised in this way can be placed on the market.</p><p>42 ```</p><h2 id=\"s45\">原PDF第 43 頁</h2><p>```text The same periods of protection apply in the case of centrally authorised products pursuant to Article 14(11) of Regulation (EC) No 726/2004.</p><p>These periods of data exclusivity and market protection according to Article 10(1) of Directive 2001/83/EC and Article 14(11) of Regulation (EC) No 726/2004 are being applied separately and independently from the periods of market exclusivity according to Article 8 of Regulation (EC) No 141/2000 and the protection provided has a different scope. According to Article 8 of Regulation (EC) No 141/2000, subject to the exceptions and derogations set out in that Article, the competent authorities shall not for a period of 10 years accept another application for a marketing authorisation or accept an application to extend an existing marketing authorisation, for the same therapeutic indication, in respect of a similar medicinal product. This is applicable regardless of whether the subsequent application is submitted on the basis of Article 10 of Directive 2001/83/EC or any other legal basis.</p><p>6.1.3 Data exclusivity and market protection for applications submitted before the implementation of the amended legislation</p><p>According to Article 89 of Regulation (EC) No 726/2004, the new periods of protection do not apply to those reference medicinal products for which the initial application for authorisation was submitted before 20 November 2005.</p><p>Equally, Directive 2004/27/EC makes it clear in Article 2 that the new periods of protection do not apply to those reference medicinal products for which an application for authorisation has been submitted before the date of transposition referred to in Article 3 of the same legal text (i.e. 30 October 2005).</p><p>Products for which the initial submission was made prior to the dates referred above continue to benefit from the previous periods of protection (except in Croatia where the new periods of protection apply for all products) which are:</p><p>   10 years for national authorisations granted by the following Member States: Belgium, Germany, France, Italy, the Netherlands, Sweden, United Kingdom, Luxemburg;</p><p>   6 years for national authorisations granted by the following Member States: Austria, Denmark, Finland, Ireland, Portugal, Spain, Greece, Poland, Czech Republic, Hungary, Lithuania, Latvia, Slovenia, Slovakia, Malta, Estonia, Cyprus, Bulgaria, Romania and also Norway, Liechtenstein and Iceland;</p><p>   10 years for all medicinal products authorised through the centralised procedure;</p><p>   10 years for all medicinal products authorised following an opinion of the CPMP in accordance with Article 4 of Directive 87/22/EEC (ex-concertation procedure).</p><p>For the purposes of the application of the mentioned provisions, the date of submission of an application, and not the date of validation by the competent authority, determines the periods of protection applicable.</p><p>43 ```</p><h2 id=\"s46\">原PDF第 44 頁</h2><p>```text Evidence of the date of authorisation of the reference product should be provided where possible in the application for the generic marketing authorisation.</p><p>In mutual recognition or decentralised procedures if the protection period in a concerned Member State is longer than in the reference Member State, mutual recognition in the concerned Member State is not possible before the expiry of the longer period.</p><p>The data exclusivity rules applicable before adoption of the current legislation allowed the coexistence of periods of six and ten years of protection in different Member States for the same product. In other words, the generic of a reference product was allowed access to the market at different points in time in different Member States. The new harmonised data exclusivity and market protection periods in Article 10(1) of Directive 2001/83/EC do not apply retroactively. It follows that:</p><p> An application in accordance with Article 10 of Directive 2001/83/EC can only be processed via the centralised procedure after expiry of the period of protection of the Member State where the reference medicinal product was authorised (e.g, if the reference product is authorised in a Member State where a ten-year period of protection applies, the application under the centralised procedure may only be submitted after the 10 year period);</p><p> An application in accordance with Article 10 of Directive 2001/83/EC can only be submitted under the decentralised/mutual recognition procedure after expiry of the period of protection of the reference medicinal product in the Reference Member State and the Concerned Member States. It follows that, if the period of protection in the Reference Member State and in three Concerned Member States is six years, a decentralised procedure to obtain a marketing authorisation in accordance with Article 10 of Directive 2001/83/EC is only possible regarding these four Member States. A mutual recognition procedure can be triggered a posteriori to cover other Concerned Member States once the protection period therein expires also.</p><p>6.1.4   Relevant periods of protection in the case of the reference medicinal product/“European Reference medicinal product”</p><p>As stated above (section 5), Article 10(1) of Directive 2001/83/EC allows a generic application to be submitted only if the reference product has been authorised for a given period of time. In addition, a generic application is possible under that provision even “if the reference medicinal product was not authorised in the Member State in which application for the generic product is submitted”. In that case, a reference product authorised in another Member State must be identified. It should be noted that the use of this provision will only be possible if the reference product is out of data exclusivity in the Member State where it is authorised.</p><p>A medicinal product could be used as reference medicinal product if three cumulative conditions are met:</p><p>44 ```</p><h2 id=\"s47\">原PDF第 45 頁</h2><p>```text  The reference medicinal product is (or has been) authorised in the EU (through a centralised or national procedure);</p><p> The reference medicinal product is or has been authorised in accordance with the pharmaceutical acquis,</p><p> The relevant data exclusivity period has expired.</p><p>Therefore, the starting date for calculating the data exclusivity period is the date of authorisation in accordance with the pharmaceutical acquis of the reference medicinal product in the territory of the European Union. The data exclusivity period must have expired in the Member States concerned on the date at which the application for the generic medicinal product is submitted (see in that respect section 6.1.2 and 6.1.3).</p><p>6.1.5. Protection periods and global marketing authorisation</p><p>For the notion of global marketing authorisation, see section 2.3. The global marketing authorisation contains the initial authorisation and all variations and extensions thereof, as well as any additional strengths, pharmaceutical form, administration routes or presentations authorised through separate procedures and under a different name, granted to the marketing authorisation holder of the initial authorisation.</p><p>In accordance with Article 6(1) of Directive 2001/83/EC, all these presentations of a given product are considered to be part of the same marketing authorisation for the purposes of applying the rules on data exclusivity and marketing protection.</p><p>This means that for a reference medicinal product, the start of the data exclusivity and market protection periods is the date when the first marketing authorisation was granted in the Union in accordance with the pharmaceutical acquis. New additional strengths, pharmaceutical form, administration routes, presentations as well as any variation and extensions do not restart or prolong this period. All additional strengths, pharmaceutical form, administration routes, presentations as well as any variation and extensions have the same end point of the data exclusivity and market protection periods, namely 8 and 10 years after the first marketing authorisation was granted, respectively. This will apply even if the new presentation has been authorised to the same marketing authorisation holder through a separate procedure, national or centralised procedure (see section 2.3), irrespective of the legal basis and under a different name31.</p><p>31 Even before the adoption of Directive 2004/27/EC and the introduction of the notion of “global marketing authorisation”, the European Court of Justice had interpreted the data protection provisions of Directive 2001/83/EC as not affording a new period of protection to the development of an original product even where the development was authorised through a separate procedure and under a different name. See Case C-106/01, Novartis, judgment of 29 April 2004, where a new presentation had been authorised to the same marketing authorisation holder through a separate procedure (informed consent procedure, in combination with the provision of bridging data under Article 10(1)(a) last subparagraph of Directive 2001/83/EC before its amendment by Directive 2004/27/EC) and under a different name.</p><p>45 ```</p><h2 id=\"s48\">原PDF第 46 頁</h2><p>```text This ten-year period can only be prolonged in the case of certain new indications, as described in section 6.2.</p><p>6.1.6 Reliance on pre-clinical and clinical data contained in the dossier of a reference medicinal product under data exclusivity</p><p>During the period of data exclusivity of a medicinal product, the data contained in the pre-clinical and clinical file of that product and obtained through access to documents or freedom of information legislation within the EU or in third countries, cannot be relied on by other applicants or the authorities in a subsequent application to ascertain the safety and efficacy of other products. As long as a product authorised in the EU is under data exclusivity, the reliance on published or unpublished pre-clinical and clinical data contained in the dossier of that product within the EU or in third countries by the competent authorities to grant a marketing authorisation would lead to a circumvention of the data exclusivity rules. Therefore, such application cannot be accepted.</p><p>6.2 Extension of the ten year period in Article 10(1) in the case of new therapeutic indications In accordance with the fourth subparagraph of Article 10(1) of Directive 2001/83/EC, the ten year period of marketing protection may be extended by one year in the event of authorisation of new therapeutic indications representing a significant clinical benefit in comparison with existing therapies. The additional year of marketing protection applies to the global marketing authorisation for the reference medicinal product. Generic products, with or without the new therapeutic indication, may not be placed on the market until expiry of the eleventh year.</p><p>To benefit from the additional year, the new indication must be approved during the first eight years since the initial marketing authorisation has been granted. The overall period of protection cannot exceed eleven years. Therefore, this provision can be used only once per ‘global marketing authorisation’ within the meaning of Article 6(1) of Directive 2001/83/EC.</p><p>Every application for a new indication must be assessed by the competent authority to determine whether the new therapeutic indication brings a significant clinical benefit in comparison with existing therapies. In the case of products authorised in accordance with Regulation (EC) No 726/2004, Commission decisions authorising new therapeutic indications will contain a clear statement of whether the new indication represents a significant clinical benefit in comparison with existing therapies. In the case of medicinal products authorised through the decentralised or mutual recognition procedures, the assessment report by the reference Member State will contain a clear statement of whether the new indication represents a significant clinical benefit in comparison with existing therapies.</p><p>This year of protection (+1) adding to the periods referred to in the previous section (8+2) applies only to those reference medicinal products for which the initial</p><p>46 ```</p><h2 id=\"s49\">原PDF第 47 頁</h2><p>```text application for authorisation is submitted after the new rules of Directive 2004/27/EC, amending Directive 2001/83/EC, and of Regulation (EC) No 726/2004 start to apply.</p><p>Guidance on elements required to support the significant benefit in comparison with existing therapies of a new therapeutic indication in order to benefit from an extended (11       years)     marketing       protection      period      is      available    at http://ec.europa.eu/health/files/eudralex/vol-2/c/guideline_14-11-2007_en.pdf</p><p>6.3. One year period of protection for new indications of well- established substances Article 10(5) of Directive 2001/83/EC reads: “In addition to the provisions laid down in paragraph 1, where an application is made for a new indication for a well- established substance, a non-cumulative period of one year of data exclusivity will be granted, provided that significant pre-clinical or clinical studies were carried out in relation to the new indication.”</p><p>Such data exclusivity period is an incentive for development of new indications whilst data protection would not otherwise apply.</p><p>For the purpose of Article 10(5) of Directive 2001/83/EC, a well-established substance is either an active substance included in the authorised medicinal product which can be shown to have a well-established use in accordance with the requirements of indent (a) in section 1 (“Well established medicinal use”) of Part II of the Annex to Directive 20001/83/EC as amended by Directive 2003/63/EC or an active substance included in a medicinal product which no longer benefits from the period of data protection provided for in Article 10(1) of Directive 2001/83/EC or Article 14(11) of Regulation (EC) 726/2004. In any case it is not required that the medicinal product concerned must have been authorised under the legal basis of the well-established use procedure.</p><p>An applicant making reference to Article 10(5) must provide justification regarding the existence of a new indication, of a well-established substance and of significant pre-clinical or clinical studies. The new indication can be included either in the existing marketing authorisation via a type II variation or submitted with an application for a new marketing authorisation.</p><p>The data exclusivity period is non-cumulative to other periods of protection: it refers exclusively to the data concerning the new indications. Therefore, the concerned medicinal product could be used as reference medicinal product with the exclusion of the indication(s) which is covered by this data exclusivity if the medicinal product fulfils the general requirements of reference medicinal product.</p><p>Every application for a new indication must be assessed by the competent authority to determine whether the new indication for a well-established substance is based on significant pre-clinical or clinical studies. In the case of products authorised in accordance with Regulation (EC) No 726/2004, Commission decisions authorising new therapeutic indications for well-established substances will contain a clear statement of whether the new indication is based on significant preclinical or clinical</p><p>47 ```</p><h2 id=\"s50\">原PDF第 48 頁</h2><p>```text studies. In the case of medicinal products authorised through the decentralised or mutual recognition procedures, the assessment report by the reference Member State will contain a clear statement of whether the new indication is based on significant preclinical or clinical studies.</p><p>Guidance on a new therapeutic indication for a well established substance is available at      http://ec.europa.eu/health/files/eudralex/vol-2/c/10%20_5_%20guideline_11- 2007_en.pdf</p><p>6.4. One year period of protection for data supporting a change of classification Article 74a of Directive 2001/83/EC reads: “Where a change of classification of a medicinal product has been authorised on the basis of significant pre-clinical tests or clinical trials, the competent authority shall not refer to the results of those tests or trials when examining an application by another applicant for or holder of marketing authorisation for a change of classification of the same substance for one year after the initial change was authorised.”</p><p>The 1-year period of protection covers significant pre-clinical or clinical trials carried out for the purpose of substantiating an application for a change of classification. The interpretation by competent authorities of the notion of significant pre-clinical tests or clinical trials under Article 74a will be without prejudice to the interpretation of that phrase under Article 10(5).</p><p>When adopting a decision authorising a change of classification of a medicinal product, the competent authority must assess whether the change is based on significant preclinical tests or clinical trials. In the case of products authorised in accordance with Regulation (EC) No 726/2004, Commission decisions authorising a change of classification will contain a clear statement of whether the change is based on significant preclinical tests or clinical trials. In the case of medicinal products authorised by the Member States, the decision of each competent authority authorising the change will contain a clear statement of whether the change is based on significant preclinical tests or clinical trials.</p><p>A change of classification authorised after the new rules of Directive 2004/27/EC, amending Directive 2001/83/EC, and of Regulation (EC) No 726/2004 start to apply may benefit from the year of protection referred to in this section.</p><p>For further guidance please refer to the Guideline on changing the classification for the supply of a medicinal product for human use, available at http://ec.europa.eu/health/files/eudralex/vol-2/c/switchguide_160106_en.pdf</p><p>48 ```</p><h2 id=\"s51\">原PDF第 49 頁</h2><p>```text 7.    VARIATIONS AND EXTENSIONS Throughout the life of a medicinal product, the marketing authorisation holder is responsible for the product which is placed on the market and is also required to take into account technical and scientific progress, and to make any amendments that may be required to enable the medicinal product to be manufactured and checked by means of generally accepted scientific methods.</p><p>Such amendments may involve changes to the product information or changes to the technical dossier submitted by the marketing authorisation holder. The procedures for the approval of such amendments have been set out in Commission Regulation (EC) No 1234/2008 concerning the examination of variations to the terms of marketing authorisations for medicinal products for human use and veterinary medicinal products. Regardless of the legal basis of the initial marketing authorisation, a marketing authorisation holder can submit an application in relation to further developments or uses of its medicinal product, including new therapeutic indications, in accordance with the provisions and requirements set out in Commission Regulation (EC) No 1234/2008 and the below mentioned Commission Guidelines.</p><p>Commission Guidelines on the details of the various categories of variations, on the operation of the procedures laid down in Chapters II, IIa, III and IV of Commission Regulation (EC) No 1234/2008 of 24 November 2008 concerning the examination of variations to the terms of marketing authorisations for medicinal products for human use and veterinary medicinal products and on the documentation to be submitted pursuant to those procedures provide additional information about procedures to amend marketing authorisations as well as the classification of variations.</p><p>Only the European Commission and the European Medicines Agency respectively are responsible for any variations relating to centrally authorised products.</p><p>Urgent safety restrictions The Variation Regulations also include provisions for the marketing authorisation holder or the competent authority to take provisional urgent safety restrictions in the event of a risk to public health.</p><p>Where the marketing authorisation holder takes urgent safety restriction, he must forthwith inform the relevant national competent authority or the EMA (in the case of authorisations granted by the member States or the Union, respectively). If the national competent authority/EMA has not raised any objections within 24 hours of the receipt of that information, the urgent safety restriction is deemed accepted. The corresponding variation application reflecting the urgent safety restriction must be submitted immediately to the national competent authority/EMA and in any case no later than 15 days after the initiation of the urgent safety restriction.</p><p>Where the national competent authority/Commission imposes provisional urgent safety restriction, the marketing authorisation holder must be obliged to implement the urgent safety restrictions. The corresponding variation application reflecting the urgent safety restriction, must be submitted immediately to the national competent</p><p>49 ```</p><h2 id=\"s52\">原PDF第 50 頁</h2><p>```text authority/EMA and in any case not later than 15 days after the initiation of the urgent safety restriction.</p><p>In all cases the appropriate documentation in support of the change must be included in the application.</p><p>8. PLASMA MASTER FILE PROCEDURE AND VACCINE ANTIGEN MASTER FILE PROCEDURE The use of the Plasma Master File (PMF) and Vaccine Antigen Master File (VAMF) certification systems is optional.</p><p>The PMF is a stand-alone documentation, which is separate from the dossier for marketing authorisation. It provides all relevant detailed information on the characteristics of the entire human plasma used as a starting material and/or a raw material for the manufacture of sub/intermediate fractions, constituents of the excipient and active substance(s), which are part of medicinal products or medical devices incorporating stable derivatives of human blood or human plasma.32.</p><p>The VAMF is a stand-alone part of the marketing authorisation application dossier for a vaccine. One given VAMF contains all relevant information of biological, pharmaceutical and chemical nature for one given vaccine antigen, which is common to several vaccines from the same applicant or marketing authorisation holder.</p><p>The PMF/VAMF certification procedure is aimed at simplifying the tasks of both applicants and competent authorities by:</p><p>   Reducing the number of dossier submissions and data evaluations carried out for the same plasma or vaccine antigen.</p><p>   Harmonising the data for a given plasma/antigen present in several medicinal products.</p><p>   Ensuring consistency throughout the European Union.</p><p>The certification procedure consists of a centralised assessment of the PMF/VAMF application dossier submitted by the applicant or marketing authorisation holder, which results in a certificate of compliance to Union legislation, issued by the EMA. This certificate is valid throughout the European Union.</p><p>As a second step, the competent authority that will grant or has granted the marketing authorisation for the concerned medicinal product(s) (plasma-derived medicinal products for PMFs, vaccines for VAMFs) takes into account the certification, re- certification or variation of the PMF/VAMF on the concerned medicinal product(s).33</p><p>32 Referred to in Directive 2000/70/EC of the European Parliament and of the Council of 16 November 2000 amending Council Directive 93/42/EC as regards medical devices incorporating stable derivatives of human blood or human plasma (OJ L 313, 13.12.2000, p. 22). 33 In this respect, sections B.V. a) and D of the Annex to the Guidelines of 16.05.2013 on the details of the various categories of variations, C (2013) 2804, need to be taken into account.</p><p>50 ```</p><h2 id=\"s53\">原PDF第 51 頁</h2><p>```text Further guidance on the procedural and scientific aspects related to the PMF/VAMF certification procedure is available at the EMA website34.</p><p>34 http://www.emea.eu.int. See in particular documents EMEA/CPMP/4548/03 (VAMF) and EMEA/CPMP/4663/03 (PMF)</p><p>51 ```</p><h2 id=\"s54\">原PDF第 52 頁</h2><p>```text ANNEX I DEFINITION OF A NEW ACTIVE SUBSTANCE A new chemical, biological or radiopharmaceutical active substance includes:</p><p>- a chemical, biological or radiopharmaceutical substance not previously authorised in a medicinal product for human use n the European Union;</p><p>- an isomer, mixture of isomers, a complex or derivative or salt of a chemical substance previously authorised in a medicinal product for human use in the European Union but differing significantly in properties with regard to safety and/or efficacy from that chemical substance previously authorised;</p><p>- a biological substance previously authorised in a medicinal product for human use in the European Union, but differing significantly in properties with regard to safety and/or efficacy which is due to differences in one or a combination of the following: in molecular structure, nature of the source material or manufacturing process;</p><p>- a radiopharmaceutical substance which is a radionuclide, or a ligand not previously authorised in a medicinal product for human use in the European Union, or the coupling mechanism to link the molecule and the radionuclide has not been authorised previously in the European Union.</p><p>52 ```</p><h2 id=\"s55\">原PDF第 53 頁</h2><p>```text ANNEX II GUIDANCE ON THE APPROPRIATE ADDITIONAL STUDIES REQUIRED FOR APPLICATIONS UNDER ARTICLE 10 OF DIRECTIVE 2001/83/EC OR EXTENSION APPLICATIONS Additional data usually required a) different salt/ester complex/derivative   Evidence that there is no change in the (with the same therapeutic moiety)        pharmacokinetics of the moiety, pharmacodynamics and/or in toxicity which could significantly change the safety/efficacy profile (otherwise, to be considered as a new active substance) b) different route/pharmaceutical form       Clinical data (safety/efficacy), (For parenteral administration, it is    pharmacokinetics, pre-clinical (e.g. local necessary to distinguish between          toxicology), if justified intraarterial, intravenous, intramuscular, subcutaneous and other routes)</p><p>i)      new route of administration ii) new pharmaceutical form (same route) (conventional to modified) c) different strength same route/ pharmaceutical form and       Bioavailability (cf. guideline) posology d) suprabioavailable products i)      same dosage intervals but         Bioavailability studies may suffice (see reduced doses intended to achieve same    paragraph 5 of Bioequivalence guideline). plasma/blood concentrations as a function of time</p><p>e) active substances associated in a         Clinical studies comparing existing/new different proportion/different posology   proportion or dosage regimen, including or if one or more is intended for         bioavailability studies. modified release.</p><p>53 ```</p></section></article></main><script nonce=\"0981518d-fa36-43e9-a32f-277d159df97b\">const q=document.getElementById('tocSearch');q.addEventListener('input',()=>{const v=q.value.toLowerCase();document.querySelectorAll('#tocList a').forEach(a=>a.style.display=!v||a.textContent.toLowerCase().includes(v)?'block':'none')});<\/script></body></html><script nonce=\"0981518d-fa36-43e9-a32f-277d159df97b\" data-html-viewer-injected>(function(){var _EH=/^on[a-z]+$/i;function _rewire(el){if(!el||!el.attributes)return;var snap=[];for(var i=0;i<el.attributes.length;i++){var a=el.attributes[i];if(_EH.test(a.name))snap.push({n:a.name,v:a.value});}for(var j=0;j<snap.length;j++){el.removeAttribute(snap[j].n);try{var fn=new Function(\"event\",snap[j].v);el.addEventListener(snap[j].n.slice(2),(function(f){return function(e){return f.call(this,e);};})(fn));}catch(e){}}}function _walk(root){if(root.nodeType===1)_rewire(root);var ch=root.querySelectorAll?root.querySelectorAll(\"*\"):[];for(var i=0;i<ch.length;i++)_rewire(ch[i]);}var _obs=new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var nl=ms[i].addedNodes;for(var j=0;j<nl.length;j++){if(nl[j].nodeType===1)_walk(nl[j]);}}});function _init(){_obs.observe(document.body||document.documentElement,{childList:true,subtree:true
